<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  try {
    const firebaseConfig = {
      databaseURL: "https://casa-pm-default-rtdb.europe-west1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "casapm");

    window._fbSet = async (data) => {
      await set(dataRef, { ...data, ts: Date.now() });
    };
    window._fbListen = (cb) => {
      onValue(dataRef, snap => {
        const val = snap.val();
        if (val) cb(val);
      }, err => {
        console.error("Firebase listen error:", err);
        window._fbError = err.message;
        const el = document.getElementById("sync-status");
        if (el) el.textContent = "⚠️ " + err.message;
      });
    };
    window._fbReady = true;
    console.log("Firebase initialized OK");
    document.dispatchEvent(new Event("fb-ready"));
  } catch(e) {
    console.error("Firebase init error:", e);
    window._fbError = e.message;
  }
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #070712; font-family: Georgia, serif; overflow-x: hidden; }
  :root {
    --gold: #C17D3C;
    --gold-dim: rgba(193,125,60,0.3);
    --blue: #7EC8E3;
    --red: #F0A0A0;
    --bg: #070712;
    --bg2: #0E0E22;
    --bg3: #16162A;
    --border: #1E1E38;
    --text: #E8E0D0;
    --muted: #888;
  }
  input, select, button { font-family: Georgia, serif; }
  input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  input::placeholder { color: #333; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-thumb { background: #1E1E38; border-radius: 3px; }
  select option { background: #16162A; }

  /* PIN */
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes ringPulse { 0%,100%{opacity:0.1} 50%{opacity:0.3} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes syncPop { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #pin-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--gold);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    animation: ringPulse 3s ease-in-out infinite;
  }
  .pin-brand { animation: fadeInUp 0.9s ease; text-align: center; position: relative; z-index:1; }
  .pin-dots { display:flex; gap:18px; justify-content:center; margin-bottom:20px; }
  .pin-dot {
    width:14px; height:14px; border-radius:50%;
    background: transparent; border: 2px solid #2A2A40;
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
  .pin-dot.err { background: #B85450; border-color: #B85450; }
  .pin-input-wrap { position: relative; z-index:1; display:flex; flex-direction:column; align-items:center; margin-top:40px; }
  #pin-field {
    width: 180px; text-align: center;
    font-size: 32px; letter-spacing: 16px;
    background: var(--bg2); color: var(--gold);
    border: 1.5px solid #2A2A40; border-radius: 14px;
    padding: 14px 20px;
    -webkit-text-security: disc;
    caret-color: var(--gold);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #pin-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); outline: none; }
  #pin-error { color: #B85450; font-size: 12px; margin-top: 12px; min-height: 18px; letter-spacing:1px; }

  /* MAIN APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.visible { display: flex; }

  /* Header */
  #header {
    background: #050510; border-bottom: 1px solid var(--border);
    padding: 12px 16px; position: sticky; top: 0; z-index: 100;
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; }
  .header-logo { display:flex; align-items:center; gap:10px; }
  .header-title-sub { color: var(--gold); font-size: 8px; letter-spacing: 4px; font-family: monospace; }
  .header-total { color: var(--text); font-size: 20px; font-weight: bold; line-height:1.1; }
  .header-right { text-align:right; }
  .header-persons { display:flex; gap:8px; justify-content:flex-end; font-size:11px; margin-bottom:4px; }
  .header-balance { display:flex; align-items:center; gap:5px; justify-content:flex-end; font-size:11px; font-weight:bold; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:#2A5A2A; animation: syncPop 3s infinite; }
  .sync-spin { width:7px; height:7px; border-radius:50%; border:1.5px solid var(--gold); border-top-color:transparent; animation: spin 0.7s linear infinite; }

  /* Month bar */
  #month-bar {
    margin-top:8px; display:flex; align-items:center; justify-content:space-between;
    background: var(--bg2); border-radius:8px; padding:6px 12px; cursor:pointer;
    font-size:12px; color: var(--gold); letter-spacing:1px;
  }
  #month-dropdown {
    display:none; margin-top:6px; background: var(--bg2);
    border-radius:10px; border:1px solid var(--border); overflow:hidden;
  }
  #month-dropdown.open { display:block; }
  .month-row {
    padding:10px 14px; border-bottom:1px solid #141428; cursor:pointer;
    display:flex; justify-content:space-between; font-size:13px; color:#777;
  }
  .month-row.active { background: var(--bg3); color: var(--text); font-weight:bold; }
  .month-row:hover { background: var(--bg3); }
  #new-month-form { padding:10px 14px; border-top:1px solid #141428; display:none; gap:6px; flex-wrap:wrap; align-items:center; }
  #new-month-form.open { display:flex; }

  /* Tabs */
  #tabs { display:flex; overflow-x:auto; gap:5px; padding:10px 12px 2px; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab-btn {
    flex-shrink:0; padding:6px 11px; border-radius:20px; border:none; cursor:pointer;
    font-size:11px; font-family:Georgia,serif; background:#0E0E22; color:#666;
    transition: all 0.12s;
  }
  .tab-btn.active { color:#fff; font-weight:bold; }
  .tab-btn:active { opacity:0.7; transform:scale(0.95); }

  /* Content */
  #content { padding:10px 12px 0; flex:1; }

  /* Cards */
  .card {
    background: var(--bg2); border-radius:14px; border:1px solid var(--border);
    margin-bottom:10px; overflow:hidden;
  }
  .card-header {
    padding:12px 16px; border-bottom:1px solid #1A1A2E;
    display:flex; justify-content:space-between; align-items:center;
  }
  .card-label { font-size:8px; letter-spacing:4px; font-family:monospace; }
  .section-title { display:flex; align-items:center; gap:8px; }
  .section-emoji { font-size:20px; }
  .section-name { font-size:14px; font-weight:bold; color: var(--text); }

  /* Balance card */
  .balance-grid { display:flex; justify-content:space-between; align-items:flex-end; padding:16px; }
  .balance-left div { margin-bottom:6px; font-size:14px; color:#AAA; }
  .balance-left div span { font-weight:bold; }
  .balance-right { text-align:right; }
  .balance-right .label { font-size:9px; color:#555; letter-spacing:3px; font-family:monospace; margin-bottom:5px; }
  .balance-big { font-size:30px; font-weight:bold; }

  /* Cat summary rows */
  .cat-row {
    background: var(--bg2); border-radius:12px; border:1px solid #141428;
    padding:11px 14px; margin-bottom:7px; cursor:pointer; transition:background 0.12s;
  }
  .cat-row:active { background: var(--bg3); }
  .cat-row-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .cat-row-bar { display:flex; height:3px; border-radius:3px; overflow:hidden; background:#070718; margin-bottom:6px; }
  .cat-row-persons { display:flex; gap:12px; font-size:11px; }

  /* Expense rows */
  .expense-row { border-bottom:1px solid #141428; transition:background 0.1s; }
  .expense-row:active { background: var(--bg3); }
  .expense-inner { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; }
  .expense-left { display:flex; align-items:center; gap:8px; flex:1; }
  .expense-name { font-size:13px; color:#C0B8A8; }
  .expense-right { display:flex; align-items:center; gap:10px; }
  .expense-amount { font-size:14px; font-weight:bold; }
  .icon-btn { background:none; border:none; cursor:pointer; font-size:14px; opacity:0.45; padding:0 2px; }

  /* Edit row */
  .edit-row { display:flex; gap:5px; padding:8px 12px; flex-wrap:wrap; align-items:center; }
  .edit-input { border:1px solid #2A2A40; border-radius:8px; padding:6px 10px; font-size:13px; background: var(--bg3); color: var(--text); }
  .edit-input.wide { flex:2; min-width:90px; }
  .edit-input.narrow { width:74px; }
  .btn-confirm { background:#27ae60; color:#fff; border:none; border-radius:8px; padding:6px 11px; cursor:pointer; font-size:13px; }
  .btn-cancel { background:#333; color:#888; border:none; border-radius:8px; padding:6px 11px; cursor:pointer; font-size:13px; }

  /* Add row */
  .add-row { display:flex; gap:5px; padding:10px 12px; background:#070718; flex-wrap:wrap; }
  .add-input { border:1px solid #2A2A40; border-radius:8px; padding:7px 10px; font-size:13px; background: var(--bg3); color: var(--text); }
  .add-input.wide { flex:2; min-width:90px; }
  .add-input.narrow { width:70px; }
  .add-select { border:1px solid #2A2A40; border-radius:8px; padding:7px 8px; font-size:13px; background: var(--bg3); color: var(--text); }
  .btn-add { color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:18px; font-weight:bold; }

  /* Subtotals bar */
  .subtotals { display:flex; justify-content:flex-end; gap:14px; padding:7px 16px; background:#070718; border-top:1px solid #141428; font-size:11px; }

  /* Empty state */
  .empty { padding:26px; text-align:center; color:#333; font-size:13px; }

  /* Vac summary */
  .vac-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #1A1A2E; }
  .vac-row-label { font-size:13px; color:#AAA; }
  .vac-row-val { font-size:14px; font-weight:bold; }
  .vac-result { background:#070718; border-radius:10px; padding:12px 14px; margin-top:14px; }
  .vac-result-label { font-size:9px; color:#444; letter-spacing:3px; font-family:monospace; }
  .vac-result-amount { font-size:28px; font-weight:bold; margin-top:4px; }
  .vac-result-formula { font-size:10px; color:#333; margin-top:5px; }
  .inline-input { border:1px solid #2A2A40; border-radius:8px; padding:5px 8px; font-size:13px; background: var(--bg3); color: var(--text); width:90px; text-align:right; }


</style>
</head>

<script>

// ── STATE ───────────────────────────────────────────────────────────────────
let state = {

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function fmt(n) { return Number(n||0).toFixed(2).replace(".",",")+"\u00a0€"; }
function uid() { return Math.random().toString(36).slice(2,9); }
function personColor(id) { return id==="paulo"?"#7EC8E3":id==="miriam"?"#F0A0A0":"#888"; }

// ── LOCAL STORAGE ────────────────────────────────────────────────────────────
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state.months));
    localStorage.setItem(LS_KEY+"_cats", JSON.stringify(state.customCats||[]));
  } catch(e){}
}

}

}
function loadConfig() {

    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

// ── FIREBASE SYNC ────────────────────────────────────────────────────────────
async function syncFromServer() {
  if (!FIREBASE_URL) return;
  try {
    const r = await fetch(`${FIREBASE_URL}/data.json`);
    if (!r.ok) return;
    const data = await r.json();
    if (data && data.months) {
      // Only update if server data is newer
      const serverStr = JSON.stringify(data.months);
      const localStr = JSON.stringify(state.months);
      if (serverStr !== localStr) {
        state.months = data.months;
        saveLocal();
        renderAll();
      }
    }
  } catch(e) { console.warn("Sync read error:", e); }
}

async function syncToServer() {
  if (!FIREBASE_URL) return;
  setSyncing(true);
  try {
    await fetch(`${FIREBASE_URL}/data.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ months: state.months })
    });
  } catch(e) { console.warn("Sync write error:", e); }
  finally { setSyncing(false); }
}

function setSyncing(v) {
  state.syncing = v;
  const el = document.getElementById("sync-indicator");
  if (!el) return;
  if (v) {
    el.className = "sync-spin";
    el.style.background = "none";
  } else {
    el.className = "sync-dot";
  }
}

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(syncFromServer, 6000);
}

// ── INIT ─────────────────────────────────────────────────────────────────────


function launchApp() {
  const key = nowKey();
  state.currentKey = state.months[key] ? key : Object.keys(state.months).sort().reverse()[0] || key;
  if (!state.months[state.currentKey]) state.months[state.currentKey] = SEED_MONTH();
  document.getElementById("app").className = "visible";
  renderAll();
  // Start Firebase listener when ready
  if (window._fbReady) {
    startFirebaseListener();
  } else {
    document.addEventListener("fb-ready", () => startFirebaseListener(), { once: true });
  }
}

// ── PIN ──────────────────────────────────────────────────────────────────────
function setupPin() {
  const field = document.getElementById("pin-field");
  field.focus();

  field.addEventListener("input", function() {
    const val = this.value.replace(/\D/g,"").slice(0,4);
    this.value = val;
    updateDots(val, false);
    if (val.length === 4) {
      setTimeout(() => {
        if (val === PIN) {
          unlockApp();
        } else {
          updateDots(val, true);
          document.getElementById("pin-error").textContent = "PIN incorrecto";
          document.getElementById("pin-wrap").style.animation = "shake 0.6s";
          setTimeout(() => {
            document.getElementById("pin-wrap").style.animation = "";
            document.getElementById("pin-error").textContent = "";
            field.value = "";
            updateDots("", false);
            field.focus();
          }, 700);
        }
      }, 150);
    }
  });

  // tap anywhere to focus
  document.getElementById("pin-screen").addEventListener("click", function(e) {
    if (e.target !== field) field.focus();
  });
}

function updateDots(val, err) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById("d"+i);
    d.className = "pin-dot" + (err ? " err" : val.length > i ? " filled" : "");
  }
}

function unlockApp() {
  document.getElementById("pin-screen").style.display = "none";
  const local = loadLocal();
  if (local) {
    state.months = local;
  } else {
    const key = nowKey();
    state.months = { [key]: SEED_MONTH() };
    saveLocal();
  }
  launchApp();
  // Always sync from Firebase on login
  syncFromServer();
}

// ── DATA HELPERS ─────────────────────────────────────────────────────────────
function currentData() {
  return state.months[state.currentKey] || EMPTY_MONTH();
}

function saveData(newData) {
  state.months[state.currentKey] = newData;
  saveLocal();
  renderAll();
  syncToServer();
}

function totals() {
  const data = currentData();
  let p=0, m=0, ab=0;
  Object.values(data.gastos).forEach(cat => cat.forEach(g => {
    if (g.persona==="paulo") p+=g.importe;
    else if (g.persona==="miriam") m+=g.importe;
    else ab+=g.importe;
  }));
  const total=p+m, mitad=total/2, deuda=mitad-m;
  return {paulo:p, miriam:m, abuelo:ab, total, mitad, deuda};
}

function catTotals(id) {
  const cat = (currentData().gastos[id]||[]);
  const p=cat.filter(g=>g.persona==="paulo").reduce((s,g)=>s+g.importe,0);
  const m=cat.filter(g=>g.persona==="miriam").reduce((s,g)=>s+g.importe,0);
  const ab=cat.filter(g=>g.persona==="abuelo").reduce((s,g)=>s+g.importe,0);
  return {paulo:p, miriam:m, abuelo:ab, total:p+m+ab};
}

function vacTotals() {
  const vac = currentData().vacaciones || {lineas:[], miriamPagado:0};
  const lineas = vac.lineas||[];
  const tp=lineas.filter(l=>l.persona==="paulo").reduce((s,l)=>s+l.importe,0);
  const tm=lineas.filter(l=>l.persona==="miriam").reduce((s,l)=>s+l.importe,0);
  const tab=lineas.filter(l=>l.persona==="abuelo").reduce((s,l)=>s+l.importe,0);
  const total=tp+tm+tab, mitad=(tp+tm)/2;
  const pagado=vac.miriamPagado||0;
  const deuda=mitad-pagado-tm;
  return {tp, tm, tab, total, mitad, pagado, deuda};
}

function renderHeader() {

  const totalDeuda = Math.max(0,t.deuda) + Math.max(0,vt.deuda);
  document.getElementById("h-total").textContent = fmt(t.total);
  document.getElementById("h-paulo").textContent = fmt(t.paulo);
  document.getElementById("h-miriam").textContent = fmt(t.miriam);
  const bal = document.getElementById("h-balance");
  bal.textContent = totalDeuda > 0 ? `👩→👨 ${fmt(totalDeuda)}` : "✓ Al día";

  document.getElementById("month-label").textContent = MESES[parseInt(mo)-1]+" "+y;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const TABS = [...TABS_FIXED, ...getCategorias(), ...TABS_END];
  tabs.innerHTML = TABS.map(tab => {
    const isActive = state.activeTab === tab.id;
    const ct = getCategorias().find(c=>c.id===tab.id) ? catTotals(tab.id) : null;
    const extra = ct && ct.total > 0 ? ` · ${fmt(ct.total)}` : "";

      style="${isActive?`background:${tab.color};`:""}"

  else {

// ── CRUD ──────────────────────────────────────────────────────────────────────
function startEdit(id, section, row) {
  state.editId = id;
  state.editSection = section;
  state.editRow = {...row};
  renderContent();
}
function cancelEdit() { state.editId = null; renderContent(); }

function saveEdit(catId, id) {
  const imp = parseFloat(String(state.editRow.importe).replace(",","."));
  if (isNaN(imp)) return;
  const data = currentData();
  data.gastos[catId] = data.gastos[catId].map(g => g.id===id ? {...g, concepto:state.editRow.concepto, importe:imp, persona:state.editRow.persona} : g);
  state.editId = null;
  saveData(data);
}

function saveVacEdit(id) {
  const imp = parseFloat(String(state.editRow.importe).replace(",","."));
  if (isNaN(imp)) return;
  const data = currentData();
  data.vacaciones.lineas = data.vacaciones.lineas.map(l => l.id===id ? {...l, concepto:state.editRow.concepto, importe:imp, persona:state.editRow.persona} : l);
  state.editId = null;
  saveData(data);
}

function deleteGasto(catId, id) {
  const data = currentData();
  data.gastos[catId] = data.gastos[catId].filter(g=>g.id!==id);
  saveData(data);
}

function deleteVacLine(id) {
  const data = currentData();

function addGasto(catId) {
  const imp = parseFloat(String(state.newRow.importe).replace(",","."));
  if (!state.newRow.concepto || isNaN(imp) || imp < 0) return;
  const data = currentData();
  if (!data.gastos[catId]) data.gastos[catId] = [];
  data.gastos[catId].push({id:uid(), concepto:state.newRow.concepto, importe:imp, persona:state.newRow.persona});
  state.newRow = {concepto:"", importe:"", persona:"paulo"};
  saveData(data);
}

// ── GESTIONAR CATEGORÍAS ─────────────────────────────────────────────────────
function renderGestionar() {
  const custom = state.customCats || [];
  const emojiOpts = CAT_EMOJIS.map(e => `<option value="${e}">${e}</option>`).join("");
  const colorOpts = CAT_COLORS.map(c => `<option value="${c}" style="background:${c}">${c}</option>`).join("");

  const customRows = custom.map((cat,i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #141428;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:18px">${cat.emoji}</span>
        <span style="font-size:13px;color:#C8C0B0;">${cat.label}</span>
        <span style="width:10px;height:10px;border-radius:50%;background:${cat.color};display:inline-block;"></span>
      </div>
      <button onclick="deleteCat('${cat.id}')" style="background:none;border:none;cursor:pointer;font-size:14px;opacity:0.5;">🗑️</button>
    </div>`).join("");

  return `
  <div class="card" style="margin-bottom:10px;">
    <div style="padding:16px;">
      <div class="card-label" style="color:#555;margin-bottom:14px;">⚙️ CATEGORÍAS PERSONALIZADAS</div>
      <div style="font-size:12px;color:#666;margin-bottom:14px;">Añade las categorías que necesites. Aparecerán como pestañas nuevas.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#070718;padding:10px;border-radius:10px;">
        <select id="new-cat-emoji" class="add-select" style="width:60px;font-size:18px;">${emojiOpts}</select>
        <input id="new-cat-name" class="add-input wide" placeholder="Nombre (ej: Coche)" style="flex:2;min-width:100px;">
        <select id="new-cat-color" class="add-select">
          ${CAT_COLORS.map(c=>`<option value="${c}">■ ${c}</option>`).join("")}
        </select>
        <button onclick="addCat()" style="background:var(--gold);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:16px;font-weight:bold;">+</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-label" style="color:#555;">MIS CATEGORÍAS</div></div>
    ${custom.length===0?'<div class="empty">Sin categorías personalizadas aún</div>':""}
    ${customRows}
    <div style="padding:12px 16px;border-top:1px solid #141428;">
      <div class="card-label" style="color:#333;margin-bottom:8px;">CATEGORÍAS FIJAS</div>
      ${CATEGORIAS_BASE.map(c=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
          <span>${c.emoji}</span>
          <span style="font-size:12px;color:#444;">${c.label}</span>
        </div>`).join("")}
    </div>
  </div>`;
}

function addCat() {
  const emoji = document.getElementById("new-cat-emoji").value;
  const label = document.getElementById("new-cat-name").value.trim();
  const color = document.getElementById("new-cat-color").value;
  if (!label) return;
  const id = "custom_" + uid();
  if (!state.customCats) state.customCats = [];
  state.customCats.push({id, label, emoji, color});
  // Also add empty gastos array to all months
  Object.keys(state.months).forEach(k => {
    if (!state.months[k].gastos[id]) state.months[k].gastos[id] = [];
  });
  document.getElementById("new-cat-name").value = "";
  saveLocal();
  syncToServer();
  renderAll();
}

function deleteCat(id) {
  state.customCats = (state.customCats||[]).filter(c=>c.id!==id);
  saveLocal();
  syncToServer();
  if (state.activeTab === id) state.activeTab = "resumen";
  renderAll();
}

// ── ICON GENERATION ──────────────────────────────────────────────────────────
function generateIcon() {
  const canvas = document.createElement("canvas");
  canvas.width = 180; canvas.height = 180;
  const ctx = canvas.getContext("2d");
  // Background
  const grd = ctx.createRadialGradient(90,90,10,90,90,90);
  grd.addColorStop(0,"#1E1E38"); grd.addColorStop(1,"#0A0A18");
  ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(90,90,90,0,Math.PI*2); ctx.fill();
  // Border
  ctx.strokeStyle = "#C17D3C"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(90,90,87,0,Math.PI*2); ctx.stroke();
  // House
  ctx.strokeStyle = "#C17D3C"; ctx.lineWidth = 5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(22,100); ctx.lineTo(90,30); ctx.lineTo(158,100); ctx.stroke();
  ctx.fillStyle = "rgba(193,125,60,0.85)";
  ctx.fillRect(35,100,32,40);
  ctx.fillStyle = "rgba(193,125,60,0.5)";
  ctx.fillRect(75,84,40,56);
  // Stars
  ctx.fillStyle = "#E8C87A";
  ctx.beginPath(); ctx.arc(130,62,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#A8C4E0";
  ctx.beginPath(); ctx.arc(50,62,11,0,Math.PI*2); ctx.fill();
  // Heart
  ctx.fillStyle = "rgba(193,125,60,0.8)";
  ctx.beginPath();
  ctx.moveTo(90,150); ctx.bezierCurveTo(90,150,70,138,70,128);
  ctx.bezierCurveTo(70,120,80,116,90,124);
  ctx.bezierCurveTo(100,116,110,120,110,128);
  ctx.bezierCurveTo(110,138,90,150,90,150);
  ctx.fill();
  const dataUrl = canvas.toDataURL("image/png");
  document.getElementById("appicon").href = dataUrl;
  document.getElementById("favicon").href = dataUrl;
}

// ── START ────────────────────────────────────────────────────────────────────
