<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa P&M">
<meta name="version" content="202610062330">
<title>Casa P&M</title>
<style>
/* RESET */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}

/* TOKENS — graphite + electric blue + gold accent */
:root{
  /* Surfaces */
  --s0: #07080D;   /* deepest background */
  --s1: #0D0F18;   /* card background */
  --s2: #131624;   /* elevated card */
  --s3: #1A1F30;   /* input / subtle */
  --s4: #222840;   /* hover state */
  /* Borders */
  --b1: #1E2438;
  --b2: #28304A;
  /* Brand */
  --blue:  #4F8EF7;
  --blue2: rgba(79,142,247,.12);
  --blue3: rgba(79,142,247,.06);
  --gold:  #D4A830;
  --gold2: rgba(212,168,48,.12);
  /* Semantic */
  --green: #34D399;
  --green2:rgba(52,211,153,.1);
  --red:   #F87171;
  --red2:  rgba(248,113,113,.1);
  --amber: #FBBF24;
  /* Text */
  --t1: #F8FAFC;   /* primary */
  --t2: #94A3B8;   /* secondary */
  --t3: #475569;   /* muted */
  /* Typography */
  --f: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --fm: 'SF Mono',ui-monospace,'Courier New',monospace;
}

body{background:var(--s0);font-family:var(--f);color:var(--t1);text-transform:uppercase;letter-spacing:.3px;}

input,select,button,textarea{font-family:var(--f);text-transform:none!important;letter-spacing:normal;}
input::placeholder{color:var(--t3);font-size:14px;}
select option{background:var(--s2);}
::-webkit-scrollbar{width:0;height:0;}

/* ANIMATIONS — one orchestrated entrance only */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes ring{0%,100%{opacity:.05}50%{opacity:.15}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}

/* ── PIN ─────────────────────────────────────────────────────────────────── */
#pin{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(ellipse 120% 80% at 50% 20%, #0D1428 0%, var(--s0) 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring{position:absolute;border-radius:50%;border:1px solid var(--gold);
  top:50%;left:50%;transform:translate(-50%,-50%);animation:ring 4s ease-in-out infinite;}
.pin-brand{animation:fadeIn .7s ease both;text-align:center;position:relative;z-index:1;}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:32px;}
.pin-dot{
  width:12px;height:12px;border-radius:50%;
  background:transparent;border:2px solid var(--b2);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.on{background:var(--blue);border-color:var(--blue);transform:scale(1.2);box-shadow:0 0 14px var(--blue2);}
.pin-dot.err{background:var(--red);border-color:var(--red);}
#pin-field:focus{outline:none;}
#pin-err{color:var(--red);font-size:11px;margin-top:12px;min-height:16px;font-family:var(--fm);letter-spacing:1px;}
.faceid-btn{
  margin-top:28px;background:none;border:1px solid var(--b2);border-radius:12px;
  padding:10px 22px;color:var(--t3);font-size:12px;cursor:pointer;
  display:none;align-items:center;gap:8px;transition:all .2s;letter-spacing:.5px;
}
.faceid-btn.available{border-color:var(--gold);color:var(--gold);}

/* ── APP SHELL ───────────────────────────────────────────────────────────── */
#app{display:none;flex-direction:column;min-height:100vh;}
#app.on{display:flex;animation:appIn .4s ease both;}
@keyframes appIn{from{opacity:0}to{opacity:1}}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
#hdr{
  background:rgba(7,8,13,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--b1);
  padding:14px 18px 12px;
  position:sticky;top:0;z-index:100;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{display:flex;align-items:center;gap:12px;}
.hdr-sub{white-space:nowrap;color:var(--blue);font-size:9px;letter-spacing:3px;font-family:var(--fm);opacity:.9;}
.hdr-total{color:var(--t1);font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.hdr-right{text-align:right;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 3s infinite;flex-shrink:0;}
.sspin{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--gold);border-top-color:transparent;animation:spin .7s linear infinite;flex-shrink:0;}
#sync-txt{display:none!important;}
.sdot.err{background:var(--red);animation:none;}
/* Barra añadir gasto rápido (cabecera) */
#qbar{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--b1);border-radius:14px;padding:8px 8px 8px 10px;cursor:pointer;}
#qbar:active{background:var(--s3);}
.qb-plus{width:34px;height:34px;border-radius:10px;background:#2DD4BF;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qb-text{flex:1;font-size:14px;color:var(--t3);}
.qb-mic{width:38px;height:34px;border-radius:10px;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* Panel superior de añadir/categorizar */
#qp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:550;display:none;}
#qp-overlay.show{display:block;}
#qp-panel{position:fixed;top:0;left:0;right:0;z-index:560;display:none;background:var(--s1);border-bottom:1px solid var(--b2);border-radius:0 0 22px 22px;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:85vh;overflow-y:auto;}
#qp-panel.show{display:block;animation:qpDown .25s ease both;}
@keyframes qpDown{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}
.qp-lbl{font-size:9px;color:var(--t3);letter-spacing:2px;font-family:var(--fm);margin:0 0 6px;}
.qp-in{width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:12px;color:var(--t1);font-size:16px;outline:none;margin-bottom:12px;}
.qp-in:focus{border-color:#2DD4BF;}
#qp-amt{font-size:28px;font-weight:700;text-align:center;}
#qp-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.qp-chip{padding:8px 11px;border-radius:10px;background:var(--s2);border:1px solid var(--b1);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;}
.qp-chip.on{color:var(--t1);}
.qp-hint{font-size:11px;color:var(--t3);margin:-6px 0 12px;line-height:1.5;}
.qp-actions{display:flex;gap:8px;}
.qp-actions button{flex:1;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
#qp-cancel{background:var(--s2);color:var(--t2);}
#qp-save{background:#2DD4BF;color:#04140F;flex:2;opacity:.4;}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--green);border-radius:14px;padding:12px 20px;color:var(--green);font-size:13px;font-weight:600;z-index:999;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .3s;}

/* Month selector */
#mbar{
  margin-top:12px;display:flex;align-items:center;justify-content:space-between;
  background:var(--s2);border:1px solid var(--b1);border-radius:12px;
  padding:9px 14px;cursor:pointer;font-size:12px;color:var(--t1);
  letter-spacing:1px;font-weight:600;transition:background .15s;
}
#mbar:active{background:var(--s3);}
#mdrop{
  display:none;margin-top:6px;background:var(--s1);
  border-radius:14px;border:1px solid var(--b1);overflow:hidden;
  box-shadow:0 24px 48px rgba(0,0,0,.6);
}
#mdrop.on{display:block;}
.mrow{
  padding:13px 18px;border-bottom:1px solid var(--b1);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--t2);transition:background .1s;font-weight:500;
}
.mrow:active{background:var(--s2);}
.mrow.cur{background:var(--s3);color:var(--t1);font-weight:700;}
#nm-form{padding:12px 16px;border-top:1px solid var(--b1);display:none;gap:8px;flex-wrap:wrap;align-items:center;}
#nm-form.on{display:flex;}

/* ── BOTTOM NAV ──────────────────────────────────────────────────────────── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(7,8,13,.96);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--b1);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 2px 8px;border:none;background:none;cursor:pointer;gap:4px;
}
.bnav-icon{width:24px;height:24px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:9px;color:var(--t3);letter-spacing:.5px;font-family:var(--fm);transition:color .15s;}
.bnav-btn.on .bnav-label{color:var(--blue);}
.bnav-btn.on .bnav-icon{transform:scale(1.15);}
.bnav-btn:active .bnav-icon{transform:scale(.9);}

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
#content{padding:16px 16px 96px;flex:1;}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--s1);border-radius:18px;
  border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;
}
.card-hdr{
  padding:14px 18px;border-bottom:1px solid var(--b1);
  display:flex;justify-content:space-between;align-items:center;
}
.lbl{font-size:9px;letter-spacing:2.5px;font-family:var(--fm);color:var(--t3);}

/* ── CATEGORY ROWS ───────────────────────────────────────────────────────── */
.cat-row{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--b1);cursor:pointer;transition:background .12s;
}
.cat-row:last-child{border-bottom:none;}
.cat-row:active{background:var(--s3);}
.cat-emoji{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.cat-label{font-size:13px;color:var(--t2);flex:1;margin-left:12px;font-weight:500;letter-spacing:.2px;}
.cat-amount{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:-.3px;}

/* ── EXPENSE ROWS ────────────────────────────────────────────────────────── */
.xrow{border-bottom:1px solid var(--b1);transition:background .1s;}
.xrow:active{background:var(--s3);}
.xin{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;}
.xleft{display:flex;flex-direction:column;gap:3px;flex:1;}
.xright{display:flex;align-items:center;gap:12px;}
.ibt{background:none;border:none;cursor:pointer;font-size:16px;opacity:.35;padding:2px;transition:opacity .15s;}
.ibt:active{opacity:1;}
.expense-name{font-size:14px;color:var(--t1);font-weight:500;}
.expense-note{font-size:11px;color:var(--t3);letter-spacing:.2px;}
.expense-amt{font-size:15px;font-weight:700;letter-spacing:-.2px;}

/* ── FORMS ───────────────────────────────────────────────────────────────── */
.erow{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap;align-items:center;background:var(--s2);}
.ei{
  border:1px solid var(--b2);border-radius:10px;padding:9px 13px;
  font-size:14px;background:var(--s3);color:var(--t1);outline:none;
  transition:border-color .15s;
}
.ei:focus{border-color:var(--blue);}
.ei.w{flex:2;min-width:90px;}
.ei.n{width:80px;}
.arow{
  display:flex;gap:6px;padding:12px 16px;background:var(--s0);
  flex-wrap:wrap;border-top:1px solid var(--b1);
}
.ai{
  border:1px solid var(--b1);border-radius:10px;padding:10px 13px;
  font-size:14px;background:var(--s2);color:var(--t1);outline:none;transition:border-color .15s;
}
.ai:focus{border-color:var(--blue);}
.ai.w{flex:2;min-width:90px;}
.ai.n{width:74px;}
.subs{
  display:flex;justify-content:flex-end;padding:10px 18px;
  background:var(--s0);border-top:1px solid var(--b1);
  font-size:12px;color:var(--t2);font-weight:600;
}
.empty{padding:36px;text-align:center;color:var(--t3);font-size:12px;letter-spacing:.5px;}
.inline-in{
  border:1px solid var(--b2);border-radius:8px;padding:7px 10px;
  font-size:14px;background:var(--s2);color:var(--t1);
  width:90px;text-align:right;outline:none;
}

/* ── CHECKLIST ───────────────────────────────────────────────────────────── */
.chk-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;
}
.chk-row:active{background:var(--s3);}
.chk-box{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;transition:all .2s;color:var(--green);
}
.chk-box.done{background:var(--green2);border-color:var(--green);}

/* ── UNDO PANEL ──────────────────────────────────────────────────────────── */
#undo-panel{
  position:fixed;bottom:80px;left:14px;right:14px;
  background:var(--s2);border:1px solid var(--b2);border-radius:16px;
  padding:14px 16px;z-index:999;opacity:0;transition:opacity .2s;
  pointer-events:none;box-shadow:0 -8px 40px rgba(0,0,0,.7);
}
#undo-panel.show{opacity:1;pointer-events:auto;}

/* ── MIC BUTTON ──────────────────────────────────────────────────────────── */
#mic-btn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:var(--blue);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 18px rgba(79,142,247,.35);
  transition:transform .15s,box-shadow .15s;
}
#mic-btn:active{transform:scale(.9);box-shadow:0 2px 12px rgba(79,142,247,.3);}

/* ── VOICE MODAL ─────────────────────────────────────────────────────────── */
#voice-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#voice-modal.show{display:flex;}
#voice-card{
  background:var(--s1);border-radius:24px 24px 0 0;width:100%;
  padding:22px 18px;padding-bottom:calc(22px + env(safe-area-inset-bottom));
  border-top:1px solid var(--b2);box-shadow:0 -24px 60px rgba(0,0,0,.6);
}
.voice-hint{
  background:var(--s3);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.6;
  border:1px solid var(--b1);
}
.voice-hint span{color:var(--blue);}
#voice-input{
  width:100%;background:var(--s2);border:1.5px solid var(--blue);
  border-radius:12px;padding:14px;font-size:16px;color:var(--t1);
  resize:none;height:52px;outline:none;box-sizing:border-box;margin-bottom:12px;
}
.voice-result{
  background:var(--green2);border-radius:12px;padding:14px;
  margin-bottom:14px;border:1px solid rgba(52,211,153,.2);display:none;
}
.voice-result.show{display:block;}
.voice-field{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--b1);
}
.voice-field:last-child{border-bottom:none;}
.voice-label{font-size:9px;color:var(--t3);letter-spacing:2px;font-family:var(--fm);}
.voice-value{font-size:14px;color:var(--t1);font-weight:600;}
.voice-actions{display:flex;gap:8px;}
.voice-actions button{
  flex:1;padding:13px;border:none;border-radius:12px;
  font-family:var(--f);font-size:14px;cursor:pointer;font-weight:600;
  transition:opacity .15s;
}
.voice-actions button:active{opacity:.8;}

/* GLOBAL INPUTS override */
input[type=number],input[type=text],input[type=password],input[type=tel],select{
  color:var(--t1)!important;background:var(--s2)!important;
  border:1px solid var(--b2)!important;border-radius:10px;
}
select option{background:var(--s2)!important;color:var(--t1)!important;}


/* Casa P&M */
.hdr-persons{display:flex;gap:10px;justify-content:flex-end;font-size:11px;font-weight:600;margin-bottom:4px;font-family:var(--fm);}
.hdr-bal{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;font-weight:700;}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--b1);}
.vresult{background:var(--s0);border-radius:12px;padding:14px;margin-top:14px;border:1px solid var(--b1);}
.iline{border:1px solid var(--b2);border-radius:8px;padding:7px 10px;font-size:14px;background:var(--s2);color:var(--t1);outline:none;}
.qp-pchip{flex:1;padding:10px 6px;border-radius:10px;background:var(--s2);border:1px solid var(--b1);color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;}

:root{--pP:#7EC8E3;--pM:#F0A0A0;--text:#F8FAFC;--bg2:var(--s1);--bg3:var(--s2);--border:var(--b1);--muted:#888;}
#qp-pers{display:flex;gap:6px;margin-bottom:14px;}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin">
  <div class="ring" style="width:240px;height:240px;animation-delay:0s;"></div>
  <div class="ring" style="width:400px;height:400px;animation-delay:.7s;animation-duration:3.5s;"></div>
  <div class="ring" style="width:560px;height:560px;animation-delay:1.4s;animation-duration:5s;"></div>
  <div class="pin-brand">
    <svg width="90" height="90" viewBox="0 0 80 80" fill="none">
      <defs>
        <radialGradient id="rbg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1E1E38"/><stop offset="100%" stop-color="#0A0A18"/></radialGradient>
        <radialGradient id="rgl" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#C17D3C" stop-opacity=".3"/><stop offset="100%" stop-color="#C17D3C" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="40" cy="40" r="38" fill="url(#rbg)" stroke="#C17D3C" stroke-width="1.2"/>
      <circle cx="40" cy="40" r="35" fill="none" stroke="#C17D3C" stroke-width=".3" stroke-dasharray="2 4"/>
      <circle cx="40" cy="40" r="38" fill="url(#rgl)"/>
      <path d="M18 44L40 22L62 44" stroke="#C17D3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="44" width="12" height="16" rx="1.5" fill="#C17D3C" opacity=".85"/>
      <rect x="42" y="38" width="14" height="22" rx="1.5" fill="#C17D3C" opacity=".5"/>
      <rect x="28" y="46" width="4" height="4" rx=".5" fill="#0A0A18" opacity=".8"/>
      <rect x="34" y="46" width="4" height="4" rx=".5" fill="#0A0A18" opacity=".8"/>
      <circle cx="54" cy="28" r="4.5" fill="#E8C87A"/>
      <circle cx="26" cy="28" r="4.5" fill="#A8C4E0"/>
      <path d="M37 56C37 56 33 52.5 33 50.2C33 48.4 34.3 47 36 47C36.8 47 37.5 47.4 38 48C38.5 47.4 39.2 47 40 47C41.7 47 43 48.4 43 50.2C43 52.5 39 56 38 57L37 56Z" fill="#C17D3C" opacity=".7"/>
    </svg>
    <div style="color:var(--gold);font-size:9px;letter-spacing:7px;margin-top:10px;font-family:monospace;">NUESTRO HOGAR</div>
    <div style="color:#F0E8D8;font-size:30px;letter-spacing:4px;font-weight:bold;margin-top:4px;text-shadow:0 0 30px rgba(193,125,60,.4);">P &amp; M</div>
    <div style="color:#3A3A5A;font-size:11px;margin-top:5px;letter-spacing:2px;">Vigo · Gastos del hogar</div>
  </div>
  <div id="pin-wrap" style="margin-top:44px;display:flex;flex-direction:column;align-items:center;">
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>

// ─── FIREBASE REST ─────────────────────────────────────────────────────────
function fbWrite(cb){
  if(!S.fbLoaded){ return; } // no pisar Firebase antes de la primera lectura
  var payload={months:S.months,customCats:S.customCats,ts:Date.now()};
  S.lastWritten=JSON.stringify(S.months);
  setSyncing(true);
  setTxt("guardando…");
  fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      S.lastTs=payload.ts;
      setSyncErr(false);
      setTxt("✓ "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}));
      setSyncing(false);
      if(cb)cb();
    })
    .catch(function(e){
      setSyncErr(true);
      setSyncing(false);
    });
}
function fbRead(){
  fetch(FB)
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(val){
      var first=!S.fbLoaded;
      S.fbLoaded=true;
      setSyncErr(false);
      if(!val||!val.months){ if(first&&Object.keys(S.months).length) fbWrite(); return; }
      if(val.ts&&val.ts===S.lastTs)return;
      var inc=JSON.stringify(val.months);
      if(inc===S.lastWritten)return;
      if(inc===JSON.stringify(S.months))return;
      S.lastTs=val.ts||null;
      S.months=val.months;
      S.customCats=val.customCats||S.customCats;
      saveLocal();
      renderAll();
      setTxt("↓ "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}));
    })
    .catch(function(){setSyncErr(true);});
}
function startPoll(){
  fbRead();
  if(S.pollTimer)clearInterval(S.pollTimer);
  S.pollTimer=setInterval(fbRead,7000);
}
function setSyncing(v){
  S.syncing=v;
  var el=document.getElementById("si");
  if(!el)return;
  var wasErr=el.classList.contains("err");
  el.className=v?"sspin":("sdot"+(wasErr?" err":""));
}
var SYNC_WARNED=false;
function syncHelp(){
  showToast(S.fbLoaded?"✓ Conectado con la nube":"⚠️ Sin conexión con la nube: ves datos locales. Abre la app en Safari desde github.io");
}
function setSyncErr(on){
  if(on && !S.fbLoaded && !SYNC_WARNED){ SYNC_WARNED=true; setTimeout(syncHelp,600); }
  var el=document.getElementById("si");
  if(el){ if(on) el.classList.add("err"); else el.classList.remove("err"); }
}
function showToast(msg){
  var t=document.createElement("div");
  t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity="0";setTimeout(function(){t.remove();},300);},msg.length>40?5000:2300);
}
function setTxt(t){var el=document.getElementById("sync-txt");if(el)el.textContent=t;}

var CRED_LS = "pp_biometric_id";

function initBiometric(){
  var btn = document.getElementById("faceid-btn");

  if(!window.PublicKeyCredential){
    btn.style.display = "none";
    return;
  }
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
    .then(function(available){
      if(available){
        btn.style.display = "flex";
        btn.style.opacity = "1";
      } else {
        btn.style.display = "none";
      }
    })
    .catch(function(){ btn.style.display = "none"; });
}

  try { storedId = localStorage.getItem(CRED_LS); } catch(e){}

  if(storedId){
    // Authenticate with existing credential
    var idBytes;
    try {
      idBytes = Uint8Array.from(atob(storedId), function(c){ return c.charCodeAt(0); });
    } catch(e) {
      // Bad stored data, re-register
      localStorage.removeItem(CRED_LS);
      useBiometric();
      return;
    }
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: idBytes, transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    }).then(function(cred){
      if(cred){ unlock(); }
    }).catch(function(err){
      // If credential not found, re-register
      if(err.name === "NotAllowedError" || err.name === "InvalidStateError"){
        localStorage.removeItem(CRED_LS);
        registerBiometric();
      }
    });
  } else {
    registerBiometric();
  }
}

function registerBiometric(){
  var challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  var userId = new Uint8Array(8);
  crypto.getRandomValues(userId);

  navigator.credentials.create({
    publicKey: {
      challenge: challenge,
      rp: { name: "Gastos App", id: location.hostname },
      user: { id: userId, name: "usuario", displayName: "Usuario" },
      pubKeyCredParams: [
        { alg: -7,   type: "public-key" },
        { alg: -257, type: "public-key" }
      ],
      authenticatorSelection: {
        authenticatorAttachment: "platform",
        userVerification: "required",
        residentKey: "discouraged"
      },
      timeout: 60000,
      attestation: "none"
    }
  }).then(function(cred){
    var idB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId)));
    try { localStorage.setItem(CRED_LS, idB64); } catch(e){}
    unlock();
  }).catch(function(err){
    // Show error briefly on the button
    var btn = document.getElementById("faceid-btn");
    if(btn){
      var orig = btn.innerHTML;
      btn.innerHTML = "⚠️ No disponible en este dispositivo";
      btn.style.color = "#F0A0A0";
      setTimeout(function(){ btn.innerHTML = orig; btn.style.color = ""; }, 3000);
    }
  });
}

// ─── UNDO (historial del día) ─────────────────────────────────────────────
var undoHistory = [];  // array de {data, label, ts}
var undoTimer = null;

function pushUndo(snapshot, label){
  // Guardar copia del mes actual antes del borrado
  undoHistory.push({
    data: JSON.parse(JSON.stringify(snapshot)),
    label: label,
    ts: Date.now()
  });
  // Limpiar entradas de más de 24h
  var cutoff = Date.now() - 86400000;
  undoHistory = undoHistory.filter(function(u){return u.ts > cutoff;});
  showUndoPanel();
}

function showUndoPanel(){
  if(undoTimer)clearTimeout(undoTimer);
  var panel = document.getElementById("undo-panel");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "undo-panel";
    document.body.appendChild(panel);
  }
  renderUndoPanel(panel);
  panel.classList.add("show");
  undoTimer = setTimeout(function(){
    panel.classList.remove("show");
  }, 6000);
}

function renderUndoPanel(panel){
  if(!panel)return;
  var items = undoHistory.slice().reverse().slice(0,5); // últimos 5
  var html = '<div style="font-size:9px;color:#555;letter-spacing:2px;font-family:monospace;margin-bottom:8px;">BORRADOS HOY</div>';
  items.forEach(function(u, i){
    var ago = Math.round((Date.now()-u.ts)/1000);
    var agoStr = ago < 60 ? "ahora" : Math.round(ago/60)+"min";
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1A1A2E;">'
      +'<span style="font-size:11px;color:#AAA;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+u.label+'</span>'
      +'<span style="font-size:10px;color:#444;margin:0 8px;">'+agoStr+'</span>'
      +'<button onclick="doUndo('+( undoHistory.length-1-i)+')" style="background:var(--gold);border:none;border-radius:6px;padding:4px 10px;color:#fff;font-size:11px;cursor:pointer;flex-shrink:0;">↩</button>'
      +'</div>';
  });
  html += '<button onclick="document.getElementById(\'undo-panel\').classList.remove(\'show\')" style="margin-top:8px;width:100%;background:none;border:none;color:#444;font-size:11px;cursor:pointer;">CERRAR</button>';
  panel.innerHTML = html;
}

function doUndo(idx){
  if(idx < 0 || idx >= undoHistory.length)return;
  if(undoTimer)clearTimeout(undoTimer);
  S.months[S.curKey] = undoHistory[idx].data;
  undoHistory.splice(idx, 1); // remove recovered item
  var panel = document.getElementById("undo-panel");
  if(undoHistory.length === 0){
    if(panel)panel.classList.remove("show");
  } else {
    renderUndoPanel(panel);
  }
  saveLocal(); renderAll(); fbWrite();
}

// ─── PIN (recordado 7 días) ─────────────────────────────────────────────────
var PIN_SESSION_KEY="cpm_session", PIN_SESSION_DAYS=7;
function checkPinSession(){
  try{var d=JSON.parse(localStorage.getItem(PIN_SESSION_KEY)||"null");
    return !!(d&&d.ts&&(Date.now()-d.ts)/86400000<PIN_SESSION_DAYS);}catch(e){return false;}
}
function savePinSession(){try{localStorage.setItem(PIN_SESSION_KEY,JSON.stringify({ts:Date.now()}));}catch(e){}}
(function(){
  if(checkPinSession()){ setTimeout(unlock,0); return; }
  var field=document.getElementById("pin-field");
  setTimeout(function(){field.focus();},300);
  field.addEventListener("input",function(){
    var v=this.value.replace(/\D/g,"").slice(0,4);
    this.value=v;
    for(var i=0;i<4;i++){
      var d=document.getElementById("pd"+i);
      d.className="pin-dot"+(v.length>i?" on":"");
    }
    if(v.length===4){
      var self=this;
      setTimeout(function(){
        if(v===PIN_CODE){unlock();}
        else{
          for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot err";
          document.getElementById("pin-err").textContent="PIN incorrecto";
          document.getElementById("pin-wrap").style.animation="shake .6s";
          setTimeout(function(){
            document.getElementById("pin-wrap").style.animation="";
            document.getElementById("pin-err").textContent="";
            self.value="";
            for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot";
            self.focus();
          },700);
        }
      },150);
    }
  });
  document.getElementById("pin").addEventListener("click",function(e){
    if(e.target!==field)field.focus();
  });
  initBiometric();
})();

function unlock(){
  savePinSession();
  document.getElementById("pin").style.display="none";
  loadLocal();
  launch();
}

function launch(){
  var k=nowKey();
  S.curKey=S.months[k]?k:Object.keys(S.months).sort().reverse()[0]||k;
  if(!S.months[S.curKey])S.months[S.curKey]=emptyMonth();
  document.getElementById("app").className="on";
  renderAll();
  startPoll();
}

// ─── DATA ──────────────────────────────────────────────────────────────────
function cur(){
  var d = S.months[S.curKey];
  if(!d) d = emptyMonth();
  // Ensure all required fields exist (defensive for old/corrupted months)
  if(!d.gastos) d.gastos = {};
  CATS_BASE.forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  (S.customCats||[]).forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  if(!d.vacaciones) d.vacaciones = {lineas:[], miriamPagado:0};
  if(!d.vacaciones.lineas) d.vacaciones.lineas = [];
  if(!d.meta) d.meta = {presupuesto:2000, bote:0};
  if(!d.alertas) d.alertas = {};
  S.months[S.curKey] = d;
  return d;
}
function saveData(d){S.months[S.curKey]=d;saveLocal();renderAll();fbWrite();}

function totals(){
  var p=0,m=0,ab=0;
  var g=cur().gastos;
  Object.keys(g).forEach(function(k){
    g[k].forEach(function(x){
      if(x.persona==="paulo")p+=x.importe;
      else if(x.persona==="miriam")m+=x.importe;
      else ab+=x.importe;
    });
  });
  var tot=p+m,mid=tot/2,deu=mid-m;
  return {paulo:p,miriam:m,abuelo:ab,total:tot,mid:mid,deu:deu};
}
function catTot(id){
  var cat=(cur().gastos[id]||[]);
  var p=0,m=0,ab=0;
  cat.forEach(function(x){
    if(x.persona==="paulo")p+=x.importe;
    else if(x.persona==="miriam")m+=x.importe;
    else ab+=x.importe;
  });
  return {paulo:p,miriam:m,abuelo:ab,total:p+m+ab};
}
function vacTot(){
  var v=cur().vacaciones||{lineas:[],miriamPagado:0};
  var l=v.lineas||[];
  var tp=0,tm=0,tab=0;
  l.forEach(function(x){
    if(x.persona==="paulo")tp+=x.importe;
    else if(x.persona==="miriam")tm+=x.importe;
    else tab+=x.importe;
  });
  var tot=tp+tm+tab,mid=(tp+tm)/2,pag=v.miriamPagado||0,deu=mid-pag-tm;
  return {tp:tp,tm:tm,tab:tab,total:tot,mid:mid,pag:pag,deu:deu};
}

// ─── CRUD ──────────────────────────────────────────────────────────────────
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function startEdit(id,sec,enc){
  S.editId=id;S.editSec=sec;
  try{S.editRow=JSON.parse(decodeURIComponent(enc));}catch(e){S.editRow={};}
  renderContent();
}
function cancelEdit(){S.editId=null;renderContent();}

function saveEdit(catId,id){
  var imp=parseFloat(String(S.editRow.importe).replace(",","."));
  if(isNaN(imp))return;
  var d=cur();
  d.gastos[catId]=d.gastos[catId].map(function(g){
    return g.id===id?Object.assign({},g,{concepto:S.editRow.concepto,importe:imp,persona:S.editRow.persona}):g;
  });
  S.editId=null;saveData(d);
}
function saveVacEdit(id){
  var imp=parseFloat(String(S.editRow.importe).replace(",","."));
  if(isNaN(imp))return;
  var d=cur();
  d.vacaciones.lineas=d.vacaciones.lineas.map(function(l){
    return l.id===id?Object.assign({},l,{concepto:S.editRow.concepto,importe:imp,persona:S.editRow.persona}):l;
  });
  S.editId=null;saveData(d);
}
function delGasto(catId,id){
  var d=cur();var deleted=d.gastos[catId].find(function(g){return g.id===id;});
  pushUndo(d,"Gasto borrado: "+(deleted?deleted.concepto:""));
  d.gastos[catId]=d.gastos[catId].filter(function(g){return g.id!==id;});saveData(d);
}
function delVac(id){
  var d=cur();var deleted=d.vacaciones.lineas.find(function(l){return l.id===id;});
  pushUndo(d,"Vacaciones borrado: "+(deleted?deleted.concepto:""));
  d.vacaciones.lineas=d.vacaciones.lineas.filter(function(l){return l.id!==id;});saveData(d);
}
function addGasto(catId){
  var imp=parseFloat(String(S.newRow.importe).replace(",","."));
  if(!S.newRow.concepto||isNaN(imp)||imp<0)return;
  var d=cur();
  if(!d.gastos[catId])d.gastos[catId]=[];
  d.gastos[catId].push({id:uid(),concepto:S.newRow.concepto,importe:imp,persona:S.newRow.persona});
  try{localStorage.setItem("cpm_persona",S.newRow.persona);}catch(e){}
  S.newRow={concepto:"",importe:"",persona:lastPersona()};saveData(d);
}
function addVac(){
  var imp=parseFloat(String(S.newRow.importe).replace(",","."));
  if(!S.newRow.concepto||isNaN(imp)||imp<0)return;
  var d=cur();
  if(!d.vacaciones.lineas)d.vacaciones.lineas=[];
  d.vacaciones.lineas.push({id:uid(),concepto:S.newRow.concepto,importe:imp,persona:S.newRow.persona});
  S.newRow={concepto:"",importe:"",persona:"paulo"};saveData(d);
}
function updateVacPag(v){
  var d=cur();d.vacaciones.miriamPagado=parseFloat(v)||0;saveData(d);
}
function addCat(){
  var emoji=document.getElementById("nc-emoji").value;
  var label=(document.getElementById("nc-name").value||"").trim();
  var color=document.getElementById("nc-color").value;
  if(!label)return;
  var id="custom_"+uid();
  if(!S.customCats)S.customCats=[];
  S.customCats.push({id:id,label:label,emoji:emoji,color:color});
  Object.keys(S.months).forEach(function(k){
    if(!S.months[k].gastos[id])S.months[k].gastos[id]=[];
  });
  document.getElementById("nc-name").value="";
  saveLocal();fbWrite();renderAll();
}
function delCat(id){
  var d=cur();pushUndo(d,"Categoría borrada");
  S.customCats=(S.customCats||[]).filter(function(c){return c.id!==id;});

function renderGraficas(){
  var keys=Object.keys(S.months).sort();
  if(keys.length===0) return '<div class="card"><div style="padding:30px;text-align:center;color:#444;font-size:13px;">SIN DATOS AÚN.<br><br>AÑADE GASTOS DE VARIOS MESES<br>PARA VER LA EVOLUCIÓN.</div></div>';

  var labels=keys.map(function(k){var p=k.split("-");return MESES[parseInt(p[1])-1].slice(0,3).toUpperCase()+" "+p[0].slice(2);});
  var allCats=cats();

  // ═══ CHART 1: Stacked bars evolution ═══
  var W=340,H=200,PL=48,PR=16,PT=16,PB=40;
  var CW=W-PL-PR, CH=H-PT-PB;
  var monthTotals=keys.map(function(k){
    return allCats.reduce(function(s,cat){return s+(S.months[k].gastos[cat.id]||[]).reduce(function(s2,x){return s2+x.importe;},0);},0);
  });
  var maxVal=Math.max.apply(null,monthTotals.concat([1]));
  var bw=keys.length>0?Math.min(40,CW/keys.length*0.6):20;
  var bSpace=keys.length>0?CW/keys.length:CW;

  // Grid lines
  var grid='';
  for(var gi=0;gi<=4;gi++){
    var gy=PT+gi*(CH/4);
    var gv=Math.round(maxVal*(1-gi/4));
    grid+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#1C1C30" stroke-width="1"/>';
    grid+='<text x="'+(PL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#555" font-family="monospace">'+gv+'</text>';
  }

  // Stacked bars
  var bars='';
  keys.forEach(function(k,i){
    var bx=PL+i*bSpace+(bSpace-bw)/2;
    var yOff=0;
    allCats.forEach(function(cat){
      var v=(S.months[k].gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
      if(v<=0)return;
      var bh=(v/maxVal)*CH;
      var by=PT+CH-yOff-bh;
      bars+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+cat.color+'" rx="1"/>';
      yOff+=bh;
    });
    // Total on top
    if(monthTotals[i]>0){
      var topY=PT+CH-(monthTotals[i]/maxVal)*CH-4;
      bars+='<text x="'+(bx+bw/2)+'" y="'+topY+'" text-anchor="middle" font-size="8" fill="#AAA" font-family="monospace">'+Math.round(monthTotals[i])+'</text>';
    }
    // X label
    bars+='<text x="'+(bx+bw/2)+'" y="'+(H-PB+14)+'" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">'+labels[i]+'</text>';
  });

  // Legend - 2 per row
  var legItems=allCats.map(function(cat,i){
    var lx=PL+(i%3)*(CW/3), ly=H+8+Math.floor(i/3)*14;
    return '<rect x="'+lx+'" y="'+(ly)+'" width="8" height="8" fill="'+cat.color+'" rx="1"/>'
      +'<text x="'+(lx+10)+'" y="'+(ly+7)+'" font-size="8" fill="#888" font-family="monospace">'+cat.label.toUpperCase()+'</text>';
  }).join('');
  var legH=Math.ceil(allCats.length/3)*14+10;

  var svgEvol='<svg viewBox="0 0 '+W+' '+(H+legH)+'" style="width:100%;display:block;">'
    +'<rect width="'+W+'" height="'+(H+legH)+'" fill="#040410" rx="10"/>'
    +grid+bars+legItems+'</svg>';

  // ═══ CHART 2: Paulo vs Miriam bars ═══
  var BW=340,BH=180,BPL=48,BPR=16,BPT=16,BPB=40;
  var BCW=BW-BPL-BPR, BCH=BH-BPT-BPB;
  var pauloD=keys.map(function(k){var p=0;Object.values(S.months[k].gastos).forEach(function(cat){cat.forEach(function(g){if(g.persona==="paulo")p+=g.importe;});});return p;});
  var miriamD=keys.map(function(k){var m=0;Object.values(S.months[k].gastos).forEach(function(cat){cat.forEach(function(g){if(g.persona==="miriam")m+=g.importe;});});return m;});
  var maxB=Math.max.apply(null,pauloD.concat(miriamD).concat([1]));
  var bw2=keys.length>0?Math.min(22,BCW/keys.length*0.35):15;
  var bsp2=keys.length>0?BCW/keys.length:BCW;
  var bscale=BCH/maxB;

  var bgrid='';
  for(var gi=0;gi<=3;gi++){
    var gy=BPT+gi*(BCH/3);
    var gv=Math.round(maxB*(1-gi/3));
    bgrid+='<line x1="'+BPL+'" y1="'+gy+'" x2="'+(BW-BPR)+'" y2="'+gy+'" stroke="#1C1C30" stroke-width="1"/>';
    bgrid+='<text x="'+(BPL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#555" font-family="monospace">'+gv+'</text>';
  }

  var bbars='';
  keys.forEach(function(k,i){
    var cx=BPL+i*bsp2+bsp2/2;
    var ph=pauloD[i]*bscale, mh=miriamD[i]*bscale;
    // Paulo bar
    bbars+='<rect x="'+(cx-bw2-2)+'" y="'+(BPT+BCH-ph)+'" width="'+bw2+'" height="'+ph+'" fill="#2C5F8A" rx="2"/>';
    // Miriam bar
    bbars+='<rect x="'+(cx+2)+'" y="'+(BPT+BCH-mh)+'" width="'+bw2+'" height="'+mh+'" fill="#8A2C2C" rx="2"/>';
    // Label
    bbars+='<text x="'+cx+'" y="'+(BH-BPB+14)+'" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">'+labels[i]+'</text>';
  });
  // Legend
  var svgPvM='<svg viewBox="0 0 '+BW+' '+(BH+20)+'" style="width:100%;display:block;">'
    +'<rect width="'+BW+'" height="'+(BH+20)+'" fill="#040410" rx="10"/>'
    +bgrid+bbars
    +'<rect x="'+BPL+'" y="'+(BH+6)+'" width="10" height="8" fill="#2C5F8A" rx="1"/>'
    +'<text x="'+(BPL+13)+'" y="'+(BH+14)+'" font-size="9" fill="#7EC8E3" font-family="monospace">PAULO</text>'
    +'<rect x="'+(BPL+70)+'" y="'+(BH+6)+'" width="10" height="8" fill="#8A2C2C" rx="1"/>'
    +'<text x="'+(BPL+83)+'" y="'+(BH+14)+'" font-size="9" fill="#F0A0A0" font-family="monospace">MIRIAM</text>'
    +'</svg>';

  // ═══ CHART 3: Donut this month ═══
  var d=cur(); var totalD=0;
  var slices=allCats.map(function(cat){
    var v=(d.gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
    totalD+=v; return{cat:cat,v:v};
  }).filter(function(s){return s.v>0;});

  var DW=340,DH=220,DR=78,CX=110,CY=110;
  var donutPaths='';
  if(totalD>0){
    var angle=-Math.PI/2;
    slices.forEach(function(s){
      var sweep=(s.v/totalD)*Math.PI*2;
      var ir=46;
      var x1=CX+DR*Math.cos(angle),   y1=CY+DR*Math.sin(angle);
      var x2=CX+DR*Math.cos(angle+sweep), y2=CY+DR*Math.sin(angle+sweep);
      var ix1=CX+ir*Math.cos(angle+sweep),iy1=CY+ir*Math.sin(angle+sweep);
      var ix2=CX+ir*Math.cos(angle),   iy2=CY+ir*Math.sin(angle);
      var large=sweep>Math.PI?1:0;
      donutPaths+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)
        +' A'+DR+' '+DR+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)
        +' L'+ix1.toFixed(1)+' '+iy1.toFixed(1)
        +' A'+ir+' '+ir+' 0 '+large+' 0 '+ix2.toFixed(1)+' '+iy2.toFixed(1)
        +' Z" fill="'+s.cat.color+'" stroke="#040410" stroke-width="2"/>';
      angle+=sweep;
    });
  }
  // Center
  donutPaths+='<text x="'+CX+'" y="'+(CY-8)+'" text-anchor="middle" font-size="9" fill="#555" font-family="monospace">TOTAL</text>';
  donutPaths+='<text x="'+CX+'" y="'+(CY+8)+'" text-anchor="middle" font-size="13" font-weight="bold" fill="#E8E0D0" font-family="Georgia,serif">'+fmt(totalD)+'</text>';

  // Right side legend with amounts
  var legR=slices.map(function(s,i){
    var ly=16+i*22;
    if(ly>DH-10)return '';
    var pct=Math.round(s.v/totalD*100);
    return '<rect x="225" y="'+ly+'" width="10" height="10" fill="'+s.cat.color+'" rx="1"/>'
      +'<text x="238" y="'+(ly+9)+'" font-size="9" fill="#888" font-family="monospace">'+s.cat.label.toUpperCase().slice(0,10)+'</text>'
      +'<text x="'+(DW-8)+'" y="'+(ly+9)+'" text-anchor="end" font-size="9" fill="'+s.cat.color+'" font-family="monospace">'+pct+'%</text>';
  }).join('');

  var svgDonut='<svg viewBox="0 0 '+DW+' '+DH+'" style="width:100%;display:block;">'
    +'<rect width="'+DW+'" height="'+DH+'" fill="#040410" rx="10"/>'
    +donutPaths+legR+'</svg>';

  return '<div class="card" style="margin-bottom:10px;"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">📈 EVOLUCIÓN MENSUAL · TOTAL POR MES</div>'
    +svgEvol+'</div></div>'
    +'<div class="card" style="margin-bottom:10px;"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">👨 PAULO VS 👩 MIRIAM</div>'
    +svgPvM+'</div></div>'
    +'<div class="card"><div style="padding:14px 16px;">'
    +'<div class="lbl" style="color:#2A6AA0;margin-bottom:10px;">🥧 DISTRIBUCIÓN · '+MESES[parseInt(S.curKey.split("-")[1])-1].toUpperCase()+'</div>'
    +svgDonut+'</div></div>';
}

        +'</div>';

    +'</div></div>';
}

function detectCat(text){
  var t=String(text||"").toLowerCase();
  var cu=S.customCats||[];
  for(var k=0;k<cu.length;k++){ if(t.indexOf(cu[k].label.toLowerCase())>=0) return cu[k].id; }
  for(var i=0;i<CATS_VOICE.length;i++){ for(var j=0;j<CATS_VOICE[i].labels.length;j++){ if(t.indexOf(CATS_VOICE[i].labels[j])>=0) return CATS_VOICE[i].id; } }
  return "otros";
}
function parseAmount(text){
  var m=text.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€|eur)/i)||text.match(/(?:^|\s)(\d+(?:[.,]\d{1,2})?)(?:\s|$)/);
  return m?parseFloat(m[1].replace(",",".")):0;
}
function qpCleanConcept(text){
  return text.replace(/\d+(?:[.,]\d{1,2})?\s*(?:euros?|€|eur)?/gi," ").replace(/\b(añadir|gasto|euros?|eur|paulo|miriam|abuelo|pagado por|paga)\b/gi," ").replace(/\s+/g," ").trim();
}

    b.className="qp-pchip"; b.setAttribute("data-p",p.id); b.setAttribute("data-col",p.color);
    b.textContent=p.emoji+" "+p.label.charAt(0)+p.label.slice(1).toLowerCase();
    b.onclick=function(id){return function(e){e.preventDefault();qpPerson(id);};}(p.id);
    pb.appendChild(b);
  });
  qpPerson(QP.persona);
  var amt=document.getElementById("qp-amt"), con=document.getElementById("qp-concept");
  amt.value=""; con.value="";
  document.getElementById("qp-title").textContent=mode==="voz"?"🎤 DICTA EL GASTO":"AÑADIR GASTO";
  document.getElementById("qp-overlay").classList.add("show");
  document.getElementById("qp-panel").classList.add("show");
  qpCheck();
  setTimeout(function(){ (mode==="voz"?con:amt).focus(); },250);
}
function closeQuick(){
  document.getElementById("qp-overlay").classList.remove("show");
  document.getElementById("qp-panel").classList.remove("show");
  var a=document.activeElement; if(a&&a.blur) a.blur();
}
function saveQuick(){
  var amt=parseFloat((document.getElementById("qp-amt").value||"").replace(",","."));
  if(!(amt>0)||!QP.cat) return;
  var concept=qpCleanConcept(document.getElementById("qp-concept").value||"");
  var catObj=cats().find(function(c){return c.id===QP.cat;});
  if(!concept) concept=catObj?catObj.label:QP.cat;
  concept=concept.charAt(0).toUpperCase()+concept.slice(1);
  var d=cur();
  if(!d.gastos[QP.cat]) d.gastos[QP.cat]=[];
  d.gastos[QP.cat].push({id:uid(),concepto:concept,importe:amt,persona:QP.persona});
  try{localStorage.setItem("cpm_persona",QP.persona);}catch(e){}
  closeQuick();
  saveData(d);
  var per=PERSONAS.find(function(p){return p.id===QP.persona;});
  showToast("✓ "+concept+" — "+fmt(amt)+" en "+(catObj?catObj.label:QP.cat)+(per?" · "+per.emoji:""));
}
(function(){
  document.getElementById("qbar").onclick=function(){ openQuick("mano"); };
  document.getElementById("qbar-mic").onclick=function(e){ e.stopPropagation(); openQuick("voz"); };
  document.getElementById("qp-overlay").onclick=closeQuick;
  document.getElementById("qp-cancel").onclick=closeQuick;
  document.getElementById("qp-save").onclick=saveQuick;
  document.getElementById("qp-amt").oninput=qpCheck;
  document.getElementById("qp-concept").oninput=function(){
    var v=this.value; if(v.trim().length<2) return;
    var a=parseAmount(v), amtEl=document.getElementById("qp-amt");
    if(a>0 && !amtEl.value) amtEl.value=a;
    if(!QP.manual) qpPick(detectCat(v),false);
    var t=v.toLowerCase();
    if(/\bmiriam\b/.test(t)) qpPerson("miriam"); else if(/\babuelo\b/.test(t)) qpPerson("abuelo"); else if(/\bpaulo\b/.test(t)) qpPerson("paulo");
    qpCheck();
  };
})();
</script>
</body>
