<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paulo Personal">
<title>Paulo Personal</title>
<style>
/* RESET */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}

/* TOKENS — graphite + electric blue + gold accent */
:root{
  /* Surfaces */
  --s0: #07080D;   /* deepest background */
  --s1: #0D0F18;   /* card background */
  --s2: #131624;   /* elevated card */
  --s3: #1A1F30;   /* input / subtle */
  --s4: #222840;   /* hover state */
  /* Borders */
  --b1: #1E2438;
  --b2: #28304A;
  /* Brand */
  --blue:  #4F8EF7;
  --blue2: rgba(79,142,247,.12);
  --blue3: rgba(79,142,247,.06);
  --gold:  #D4A830;
  --gold2: rgba(212,168,48,.12);
  /* Semantic */
  --green: #34D399;
  --green2:rgba(52,211,153,.1);
  --red:   #F87171;
  --red2:  rgba(248,113,113,.1);
  --amber: #FBBF24;
  /* Text */
  --t1: #F8FAFC;   /* primary */
  --t2: #94A3B8;   /* secondary */
  --t3: #475569;   /* muted */
  /* Typography */
  --f: -apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --fm: 'SF Mono',ui-monospace,'Courier New',monospace;
}

body{background:var(--s0);font-family:var(--f);color:var(--t1);text-transform:uppercase;letter-spacing:.3px;}

input,select,button,textarea{font-family:var(--f);text-transform:none!important;letter-spacing:normal;}
input::placeholder{color:var(--t3);font-size:14px;}
select option{background:var(--s2);}
::-webkit-scrollbar{width:0;height:0;}

/* ANIMATIONS — one orchestrated entrance only */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes ring{0%,100%{opacity:.05}50%{opacity:.15}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}

/* ── PIN ─────────────────────────────────────────────────────────────────── */
#pin{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(ellipse 120% 80% at 50% 20%, #0D1428 0%, var(--s0) 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring{position:absolute;border-radius:50%;border:1px solid var(--gold);
  top:50%;left:50%;transform:translate(-50%,-50%);animation:ring 4s ease-in-out infinite;}
.pin-brand{animation:fadeIn .7s ease both;text-align:center;position:relative;z-index:1;}
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:32px;}
.pin-dot{
  width:12px;height:12px;border-radius:50%;
  background:transparent;border:2px solid var(--b2);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.on{background:var(--blue);border-color:var(--blue);transform:scale(1.2);box-shadow:0 0 14px var(--blue2);}
.pin-dot.err{background:var(--red);border-color:var(--red);}
#pin-field:focus{outline:none;}
#pin-err{color:var(--red);font-size:11px;margin-top:12px;min-height:16px;font-family:var(--fm);letter-spacing:1px;}
.faceid-btn{
  margin-top:28px;background:none;border:1px solid var(--b2);border-radius:12px;
  padding:10px 22px;color:var(--t3);font-size:12px;cursor:pointer;
  display:none;align-items:center;gap:8px;transition:all .2s;letter-spacing:.5px;
}
.faceid-btn.available{border-color:var(--gold);color:var(--gold);}

/* ── APP SHELL ───────────────────────────────────────────────────────────── */
#app{display:none;flex-direction:column;min-height:100vh;}
#app.on{display:flex;animation:fadeIn .5s ease both;}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
#hdr{
  background:rgba(7,8,13,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--b1);
  padding:14px 18px 12px;
  position:sticky;top:0;z-index:100;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{display:flex;align-items:center;gap:12px;}
.hdr-sub{color:var(--blue);font-size:9px;letter-spacing:4px;font-family:var(--fm);opacity:.9;}
.hdr-total{color:var(--t1);font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px;}
.hdr-right{text-align:right;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 3s infinite;flex-shrink:0;}
.sspin{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--gold);border-top-color:transparent;animation:spin .7s linear infinite;flex-shrink:0;}
#sync-txt{font-size:9px;color:var(--t3);margin-top:2px;font-family:var(--fm);}

/* Month selector */
#mbar{
  margin-top:12px;display:flex;align-items:center;justify-content:space-between;
  background:var(--s2);border:1px solid var(--b1);border-radius:12px;
  padding:9px 14px;cursor:pointer;font-size:12px;color:var(--t1);
  letter-spacing:1px;font-weight:600;transition:background .15s;
}
#mbar:active{background:var(--s3);}
#mdrop{
  display:none;margin-top:6px;background:var(--s1);
  border-radius:14px;border:1px solid var(--b1);overflow:hidden;
  box-shadow:0 24px 48px rgba(0,0,0,.6);
}
#mdrop.on{display:block;}
.mrow{
  padding:13px 18px;border-bottom:1px solid var(--b1);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--t2);transition:background .1s;font-weight:500;
}
.mrow:active{background:var(--s2);}
.mrow.cur{background:var(--s3);color:var(--t1);font-weight:700;}
#nm-form{padding:12px 16px;border-top:1px solid var(--b1);display:none;gap:8px;flex-wrap:wrap;align-items:center;}
#nm-form.on{display:flex;}

/* ── BOTTOM NAV ──────────────────────────────────────────────────────────── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(7,8,13,.96);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--b1);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 2px 8px;border:none;background:none;cursor:pointer;gap:4px;
}
.bnav-icon{width:24px;height:24px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:9px;color:var(--t3);letter-spacing:.5px;font-family:var(--fm);transition:color .15s;}
.bnav-btn.on .bnav-label{color:var(--blue);}
.bnav-btn.on .bnav-icon{transform:scale(1.15);}
.bnav-btn:active .bnav-icon{transform:scale(.9);}

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
#content{padding:16px 16px 96px;flex:1;}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--s1);border-radius:18px;
  border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;
}
.card-hdr{
  padding:14px 18px;border-bottom:1px solid var(--b1);
  display:flex;justify-content:space-between;align-items:center;
}
.lbl{font-size:9px;letter-spacing:2.5px;font-family:var(--fm);color:var(--t3);}

/* ── CATEGORY ROWS ───────────────────────────────────────────────────────── */
.cat-row{
  display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--b1);cursor:pointer;transition:background .12s;
}
.cat-row:last-child{border-bottom:none;}
.cat-row:active{background:var(--s3);}
.cat-emoji{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.cat-label{font-size:13px;color:var(--t2);flex:1;margin-left:12px;font-weight:500;letter-spacing:.2px;}
.cat-amount{font-size:16px;font-weight:700;color:var(--t1);letter-spacing:-.3px;}

/* ── EXPENSE ROWS ────────────────────────────────────────────────────────── */
.xrow{border-bottom:1px solid var(--b1);transition:background .1s;}
.xrow:active{background:var(--s3);}
.xin{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;}
.xleft{display:flex;flex-direction:column;gap:3px;flex:1;}
.xright{display:flex;align-items:center;gap:12px;}
.ibt{background:none;border:none;cursor:pointer;font-size:16px;opacity:.35;padding:2px;transition:opacity .15s;}
.ibt:active{opacity:1;}
.expense-name{font-size:14px;color:var(--t1);font-weight:500;}
.expense-note{font-size:11px;color:var(--t3);letter-spacing:.2px;}
.expense-amt{font-size:15px;font-weight:700;letter-spacing:-.2px;}

/* ── FORMS ───────────────────────────────────────────────────────────────── */
.erow{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap;align-items:center;background:var(--s2);}
.ei{
  border:1px solid var(--b2);border-radius:10px;padding:9px 13px;
  font-size:14px;background:var(--s3);color:var(--t1);outline:none;
  transition:border-color .15s;
}
.ei:focus{border-color:var(--blue);}
.ei.w{flex:2;min-width:90px;}
.ei.n{width:80px;}
.arow{
  display:flex;gap:6px;padding:12px 16px;background:var(--s0);
  flex-wrap:wrap;border-top:1px solid var(--b1);
}
.ai{
  border:1px solid var(--b1);border-radius:10px;padding:10px 13px;
  font-size:14px;background:var(--s2);color:var(--t1);outline:none;transition:border-color .15s;
}
.ai:focus{border-color:var(--blue);}
.ai.w{flex:2;min-width:90px;}
.ai.n{width:74px;}
.subs{
  display:flex;justify-content:flex-end;padding:10px 18px;
  background:var(--s0);border-top:1px solid var(--b1);
  font-size:12px;color:var(--t2);font-weight:600;
}
.empty{padding:36px;text-align:center;color:var(--t3);font-size:12px;letter-spacing:.5px;}
.inline-in{
  border:1px solid var(--b2);border-radius:8px;padding:7px 10px;
  font-size:14px;background:var(--s2);color:var(--t1);
  width:90px;text-align:right;outline:none;
}

/* ── CHECKLIST ───────────────────────────────────────────────────────────── */
.chk-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .1s;
}
.chk-row:active{background:var(--s3);}
.chk-box{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;transition:all .2s;color:var(--green);
}
.chk-box.done{background:var(--green2);border-color:var(--green);}

/* ── UNDO PANEL ──────────────────────────────────────────────────────────── */
#undo-panel{
  position:fixed;bottom:80px;left:14px;right:14px;
  background:var(--s2);border:1px solid var(--b2);border-radius:16px;
  padding:14px 16px;z-index:999;opacity:0;transition:opacity .2s;
  pointer-events:none;box-shadow:0 -8px 40px rgba(0,0,0,.7);
}
#undo-panel.show{opacity:1;pointer-events:auto;}

/* ── MIC BUTTON ──────────────────────────────────────────────────────────── */
#mic-btn{
  position:fixed;bottom:80px;right:18px;
  width:48px;height:48px;border-radius:50%;
  background:var(--blue);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  z-index:201;box-shadow:0 4px 24px rgba(79,142,247,.4);
  transition:transform .15s,box-shadow .15s;
}
#mic-btn:active{transform:scale(.9);box-shadow:0 2px 12px rgba(79,142,247,.3);}

/* ── VOICE MODAL ─────────────────────────────────────────────────────────── */
#voice-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#voice-modal.show{display:flex;}
#voice-card{
  background:var(--s1);border-radius:24px 24px 0 0;width:100%;
  padding:22px 18px;padding-bottom:calc(22px + env(safe-area-inset-bottom));
  border-top:1px solid var(--b2);box-shadow:0 -24px 60px rgba(0,0,0,.6);
}
.voice-hint{
  background:var(--s3);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.6;
  border:1px solid var(--b1);
}
.voice-hint span{color:var(--blue);}
#voice-input{
  width:100%;background:var(--s2);border:1.5px solid var(--blue);
  border-radius:12px;padding:14px;font-size:16px;color:var(--t1);
  resize:none;height:52px;outline:none;box-sizing:border-box;margin-bottom:12px;
}
.voice-result{
  background:var(--green2);border-radius:12px;padding:14px;
  margin-bottom:14px;border:1px solid rgba(52,211,153,.2);display:none;
}
.voice-result.show{display:block;}
.voice-field{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--b1);
}
.voice-field:last-child{border-bottom:none;}
.voice-label{font-size:9px;color:var(--t3);letter-spacing:2px;font-family:var(--fm);}
.voice-value{font-size:14px;color:var(--t1);font-weight:600;}
.voice-actions{display:flex;gap:8px;}
.voice-actions button{
  flex:1;padding:13px;border:none;border-radius:12px;
  font-family:var(--f);font-size:14px;cursor:pointer;font-weight:600;
  transition:opacity .15s;
}
.voice-actions button:active{opacity:.8;}

/* GLOBAL INPUTS override */
input[type=number],input[type=text],input[type=password],input[type=tel],select{
  color:var(--t1)!important;background:var(--s2)!important;
  border:1px solid var(--b2)!important;border-radius:10px;
}
select option{background:var(--s2)!important;color:var(--t1)!important;}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin">
  <div class="ring" style="width:240px;height:240px;animation-delay:0s;"></div>
  <div class="ring" style="width:400px;height:400px;animation-delay:.7s;animation-duration:3.5s;"></div>
  <div class="ring" style="width:560px;height:560px;animation-delay:1.4s;animation-duration:5s;"></div>
  <div class="pin-brand">
    <svg width="110" height="110" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>

          <stop offset="0%" stop-color="#00FFAA" stop-opacity=".18"/>

        </radialGradient>
        <radialGradient id="fg2" cx="50%" cy="40%" r="45%">
          <stop offset="0%" stop-color="#4F8EF7" stop-opacity=".12"/>
          <stop offset="100%" stop-color="#000510" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fb" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F7B731"/>
          <stop offset="100%" stop-color="#F7931A"/>
        </linearGradient>
        <linearGradient id="fd" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00FFAA"/>
          <stop offset="100%" stop-color="#4F8EF7"/>
        </linearGradient>
        <linearGradient id="fo1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F8EF7" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#00FFAA" stop-opacity=".6"/>
          <stop offset="100%" stop-color="#4F8EF7" stop-opacity=".05"/>
        </linearGradient>
        <linearGradient id="fo2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00FFAA" stop-opacity=".9"/>
          <stop offset="55%" stop-color="#4F8EF7" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#00FFAA" stop-opacity=".05"/>
        </linearGradient>
        <linearGradient id="fo3" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4F8EF7" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#4F8EF7" stop-opacity=".05"/>
        </linearGradient>
      </defs>
      <!-- Background -->
      <rect width="120" height="120" fill="#040812"/>
      <!-- Glow halos -->
      <ellipse cx="60" cy="60" rx="56" ry="56" fill="url(#fg1)"/>
      <ellipse cx="60" cy="50" rx="40" ry="40" fill="url(#fg2)"/>
      <!-- Orbit 1 — blue/green -->
      <ellipse cx="60" cy="58" rx="50" ry="20" stroke="url(#fo1)" stroke-width="2" fill="none" transform="rotate(-22 60 58)"/>
      <!-- Orbit 2 — green/blue -->
      <ellipse cx="60" cy="58" rx="52" ry="18" stroke="url(#fo2)" stroke-width="1.5" fill="none" transform="rotate(32 60 58)"/>
      <!-- Orbit 3 — thin blue -->
      <ellipse cx="60" cy="58" rx="46" ry="22" stroke="url(#fo3)" stroke-width="1" fill="none" transform="rotate(80 60 58)"/>
      <!-- Orbit glow dots -->
      <circle cx="20" cy="52" r="3" fill="#4F8EF7" opacity=".95"/>
      <circle cx="101" cy="65" r="2.5" fill="#00FFAA" opacity=".9"/>
      <circle cx="74" cy="16" r="2" fill="#4F8EF7" opacity=".75"/>
      <circle cx="43" cy="100" r="2" fill="#00FFAA" opacity=".65"/>
      <circle cx="14" cy="72" r="1.5" fill="#4F8EF7" opacity=".5"/>
      <circle cx="106" cy="44" r="1.5" fill="#00FFAA" opacity=".5"/>
      <!-- Bar chart top-right (green neón) -->
      <rect x="76" y="16" width="5" height="16" rx="1.5" fill="#00FFAA" opacity=".9"/>
      <rect x="83" y="10" width="5" height="22" rx="1.5" fill="#00FFAA" opacity=".85"/>
      <rect x="90" y="4"  width="5" height="28" rx="1.5" fill="#00FFAA" opacity=".8"/>
      <!-- Circuit lines -->
      <line x1="6" y1="28" x2="16" y2="28" stroke="#4F8EF7" stroke-width="0.6" opacity=".2"/>
      <line x1="16" y1="28" x2="16" y2="40" stroke="#4F8EF7" stroke-width="0.6" opacity=".2"/>
      <line x1="104" y1="82" x2="114" y2="82" stroke="#00FFAA" stroke-width="0.6" opacity=".2"/>
      <line x1="104" y1="72" x2="104" y2="82" stroke="#00FFAA" stroke-width="0.6" opacity=".2"/>
      <!-- B (Bitcoin, gold) -->
      <text x="28" y="78" font-family="-apple-system,sans-serif" font-size="50" font-weight="900" fill="url(#fb)">B</text>
      <!-- $ (dollar, blue-green gradient) -->
      <text x="62" y="78" font-family="-apple-system,sans-serif" font-size="44" font-weight="900" fill="url(#fd)">$</text>
    </svg>
    <div style="color:var(--blue);font-size:9px;letter-spacing:5px;margin-top:18px;font-family:var(--fm);">GASTOS PERSONALES</div>
    <div style="color:var(--t1);font-size:32px;letter-spacing:1px;font-weight:700;margin-top:8px;font-family:var(--f);">PAULO</div>
    <div style="color:var(--t3);font-size:10px;margin-top:8px;letter-spacing:1.5px;font-family:var(--fm);">Control financiero personal</div>
  </div>
  <div id="pin-wrap" style="margin-top:36px;display:flex;flex-direction:column;align-items:center;width:100%;padding:0 32px;box-sizing:border-box;">
    <div class="pin-dots" style="margin-bottom:24px;">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <input id="pin-field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-size:32px;letter-spacing:16px;width:100%;max-width:260px;text-align:center;background:rgba(255,255,255,.06);color:#F8FAFC;border:1.5px solid rgba(0,255,170,.3);border-radius:16px;padding:16px 20px;caret-color:#00FFAA;outline:none;-webkit-appearance:none;appearance:none;display:block;position:relative;z-index:10;">
    <div id="pin-err"></div>
    <button id="faceid-btn" class="faceid-btn" onclick="useBiometric()" style="display:none;opacity:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="M9 9a4 4 0 0 1 6 0M9 15a4 4 0 0 0 6 0"/></svg>
      Face ID / Touch ID
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">
        <svg width="38" height="38" viewBox="0 0 120 120" fill="none">
          <defs>

function applyRecurrentes(monthData){
  // Only apply if fijos is completely empty (new month)
  var fijosEmpty = !monthData.gastos.fijos || monthData.gastos.fijos.length === 0;
  var invEmpty   = !monthData.gastos.inversion || monthData.gastos.inversion.length === 0;
  if(!fijosEmpty && !invEmpty) return monthData; // already has data
  GASTOS_RECURRENTES.forEach(function(g){
    var catEmpty = !monthData.gastos[g.cat] || monthData.gastos[g.cat].length === 0;
    if(!catEmpty) return; // don't overwrite existing
    if(!monthData.gastos[g.cat]) monthData.gastos[g.cat] = [];
    monthData.gastos[g.cat].push({
      id: uid(),
      concepto: g.concepto,
      importe: g.importe,
      nota: "🔄 Recurrente"
    });
  });
  return monthData;

function applyDefaultsToAllMonths(){

function fbWrite(cb){
  var payload={months:S.months,customCats:S.customCats,ts:Date.now()};
  S.lastWritten=JSON.stringify(S.months);
  setSyncing(true);
  setTxt("guardando…");
  fetch(FB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      S.lastTs=payload.ts;
      setTxt("✓ "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}));
      setSyncing(false);
      if(cb)cb();
    })
    .catch(function(e){
      setTxt("⚠️ "+e.message);
      setSyncing(false);
    });
}
var FB_RETRY=0;
function fbRead(){
  fetch(FB)
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(val){
      FB_RETRY=0;
      if(!val||!val.months)return;
      if(val.ts&&val.ts===S.lastTs)return;
      var inc=JSON.stringify(val.months);
      if(inc===S.lastWritten)return;
      if(inc===JSON.stringify(S.months))return;
      S.lastTs=val.ts||null;
      S.months=val.months;
      S.customCats=val.customCats||S.customCats;
      if(val.carteraData) S.carteraData=val.carteraData;
      applyDefaultsToAllMonths();
      saveLocal();
      renderAll();
      setSyncing(false);
      setTxt("↓ "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}));
    })
    .catch(function(){
      FB_RETRY++;
      if(FB_RETRY<=3){setTimeout(fbRead,FB_RETRY*3000);}
      setSyncing(false);
    });
}
function startPoll(){
  fbRead();
  if(S.pollTimer)clearInterval(S.pollTimer);

// ─── BIOMETRIC (Face ID / Touch ID) ──────────────────────────────────────────
var CRED_LS = "pp_biometric_id";

function initBiometric(){
  var btn = document.getElementById("faceid-btn");
  if(!btn) return;
  if(!window.PublicKeyCredential){
    btn.style.display = "none";
    return;
  }
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
    .then(function(available){
      if(available){
        btn.style.display = "flex";
        btn.style.opacity = "1";
      } else {
        btn.style.display = "none";
      }
    })
    .catch(function(){ btn.style.display = "none"; });
}

function useBiometric(){
  var btn = document.getElementById("faceid-btn");
  var storedId = null;
  try { storedId = localStorage.getItem(CRED_LS); } catch(e){}

  if(storedId){
    // Authenticate with existing credential
    var idBytes;
    try {
      idBytes = Uint8Array.from(atob(storedId), function(c){ return c.charCodeAt(0); });
    } catch(e) {
      // Bad stored data, re-register
      localStorage.removeItem(CRED_LS);
      useBiometric();
      return;
    }
    var challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: idBytes, transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    }).then(function(cred){
      if(cred){ unlock(); }
    }).catch(function(err){
      // If credential not found, re-register
      if(err.name === "NotAllowedError" || err.name === "InvalidStateError"){
        localStorage.removeItem(CRED_LS);
        registerBiometric();
      }
    });
  } else {
    registerBiometric();
  }
}

function registerBiometric(){
  var challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  var userId = new Uint8Array(8);
  crypto.getRandomValues(userId);

  navigator.credentials.create({
    publicKey: {
      challenge: challenge,
      rp: { name: "Gastos App", id: location.hostname },
      user: { id: userId, name: "usuario", displayName: "Usuario" },
      pubKeyCredParams: [
        { alg: -7,   type: "public-key" },
        { alg: -257, type: "public-key" }
      ],
      authenticatorSelection: {
        authenticatorAttachment: "platform",
        userVerification: "required",
        residentKey: "discouraged"
      },
      timeout: 60000,
      attestation: "none"
    }
  }).then(function(cred){
    var idB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(cred.rawId)));
    try { localStorage.setItem(CRED_LS, idB64); } catch(e){}
    unlock();
  }).catch(function(err){
    // Show error briefly on the button
    var btn = document.getElementById("faceid-btn");
    if(btn){
      var orig = btn.innerHTML;
      btn.innerHTML = "⚠️ No disponible en este dispositivo";
      btn.style.color = "#F0A0A0";
      setTimeout(function(){ btn.innerHTML = orig; btn.style.color = ""; }, 3000);
    }
  });
}

// ─── UNDO (historial del día) ─────────────────────────────────────────────
var undoHistory = [];  // array de {data, label, ts}
var undoTimer = null;

function pushUndo(snapshot, label){
  // Guardar copia del mes actual antes del borrado
  undoHistory.push({
    data: JSON.parse(JSON.stringify(snapshot)),
    label: label,
    ts: Date.now()
  });
  // Limpiar entradas de más de 24h
  var cutoff = Date.now() - 86400000;
  undoHistory = undoHistory.filter(function(u){return u.ts > cutoff;});
  showUndoPanel();
}

function showUndoPanel(){
  if(undoTimer)clearTimeout(undoTimer);
  var panel = document.getElementById("undo-panel");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "undo-panel";
    document.body.appendChild(panel);
  }
  renderUndoPanel(panel);
  panel.classList.add("show");
  undoTimer = setTimeout(function(){
    panel.classList.remove("show");
  }, 6000);
}

function renderUndoPanel(panel){
  if(!panel)return;
  var items = undoHistory.slice().reverse().slice(0,5); // últimos 5
  var html = '<div style="font-size:9px;color:#555;letter-spacing:2px;font-family:monospace;margin-bottom:8px;">BORRADOS HOY</div>';
  items.forEach(function(u, i){
    var ago = Math.round((Date.now()-u.ts)/1000);
    var agoStr = ago < 60 ? "ahora" : Math.round(ago/60)+"min";
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1A1A2E;">'
      +'<span style="font-size:11px;color:#AAA;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+u.label+'</span>'
      +'<span style="font-size:10px;color:#444;margin:0 8px;">'+agoStr+'</span>'
      +'<button onclick="doUndo('+( undoHistory.length-1-i)+')" style="background:var(--gold);border:none;border-radius:6px;padding:4px 10px;color:#fff;font-family:Georgia,serif;font-size:11px;cursor:pointer;flex-shrink:0;">↩</button>'
      +'</div>';
  });
  html += '<button onclick="document.getElementById(\'undo-panel\').classList.remove(\'show\')" style="margin-top:8px;width:100%;background:none;border:none;color:#444;font-size:11px;cursor:pointer;font-family:Georgia,serif;">CERRAR</button>';
  panel.innerHTML = html;
}

function doUndo(idx){
  if(idx < 0 || idx >= undoHistory.length)return;
  if(undoTimer)clearTimeout(undoTimer);
  S.months[S.curKey] = undoHistory[idx].data;
  undoHistory.splice(idx, 1); // remove recovered item
  var panel = document.getElementById("undo-panel");
  if(undoHistory.length === 0){
    if(panel)panel.classList.remove("show");
  } else {
    renderUndoPanel(panel);
  }
  saveLocal(); renderAll(); fbWrite();
}


// ─── PIN SESSION (recordar PIN 7 días) ───────────────────────────────────────
var PIN_SESSION_KEY = "pp_session";
var PIN_SESSION_DAYS = 30;

function checkPinSession(){
  try {
    var raw = localStorage.getItem(PIN_SESSION_KEY);
    if(!raw) return false;
    var data = JSON.parse(raw);
    if(!data.ts) return false;
    var elapsed = Date.now() - data.ts;
    var days = elapsed / (1000 * 60 * 60 * 24);
    if(days < PIN_SESSION_DAYS){
      return true; // sesión válida
    } else {
      localStorage.removeItem(PIN_SESSION_KEY);
      return false;
    }
  } catch(e){ return false; }
}

function savePinSession(){
  try { localStorage.setItem(PIN_SESSION_KEY, JSON.stringify({ts: Date.now()})); } catch(e){}
}

// ─── PIN ───────────────────────────────────────────────────────────────────
(function(){
  // Check if valid session exists — skip PIN
  if(checkPinSession()){
    document.getElementById("pin").style.display="none";
    loadLocal();
    if(!Object.keys(S.months).length){
      var k=nowKey();S.months[k]=seedMonth();saveLocal();
    }
    launch();
    return;
  }
  var field=document.getElementById("pin-field");
  setTimeout(function(){field.focus();},300);
  field.addEventListener("input",function(){
    var v=this.value.replace(/\D/g,"").slice(0,4);
    this.value=v;
    for(var i=0;i<4;i++){
      var d=document.getElementById("pd"+i);
      d.className="pin-dot"+(v.length>i?" on":"");
    }
    if(v.length===4){
      var self=this;
      setTimeout(function(){
        if(v===PIN_CODE){unlock();}
        else{
          for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot err";
          document.getElementById("pin-err").textContent="PIN incorrecto";
          document.getElementById("pin-wrap").style.animation="shake .6s";
          setTimeout(function(){
            document.getElementById("pin-wrap").style.animation="";
            document.getElementById("pin-err").textContent="";
            self.value="";
            for(var i=0;i<4;i++)document.getElementById("pd"+i).className="pin-dot";
            self.focus();
          },700);
        }
      },150);
    }
  });
  document.getElementById("pin").addEventListener("click",function(e){
    if(e.target!==field)field.focus();
  });
  initBiometric();
})();

function unlock(){
  savePinSession();
  document.getElementById("pin").style.display="none";
  loadLocal();
  if(!Object.keys(S.months).length){
    var k=nowKey();
    S.months[k]=seedMonth();
    saveLocal();
  }
  launch();
}

function launch(){
  var k=nowKey();
  // Use current month if exists, else most recent, else current
  if(S.months[k]){
    S.curKey=k;
  } else {
    var keys=Object.keys(S.months).sort().reverse();
    S.curKey=keys.length?keys[0]:k;
  }
  // Only seed if truly no months at all
  if(!S.months[S.curKey]){
    S.months[S.curKey]=emptyMonth();
  }
  applyDefaultsToAllMonths();
  document.getElementById("app").className="on";
  renderAll();
  startPoll();
}

// ─── DATA ──────────────────────────────────────────────────────────────────
function cur(){
  var d = S.months[S.curKey];
  if(!d) d = emptyMonth();
  // Ensure all required fields exist (defensive for old/corrupted months)
  if(!d.gastos) d.gastos = {};
  CATS_BASE.forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  (S.customCats||[]).forEach(function(c){ if(!d.gastos[c.id]) d.gastos[c.id] = []; });
  if(!d.gasolina) d.gasolina = [];
  if(!d.apuestas) d.apuestas = {balance_mes:0, acum_anio:0, lineas:[]};
  if(!d.apuestas.lineas) d.apuestas.lineas = [];
  if(!d.bankinter) d.bankinter = BANKINTER_BASE.map(function(b){return Object.assign({},b,{pagado:false});});
  if(!d.sabadell) d.sabadell = SABADELL_BASE.map(function(b){return Object.assign({},b,{pagado:false});});
  if(!d.notas) d.notas = [];
  if(!d.meta) d.meta = {presupuesto:2850, bote:0, ingresos:2850};
  if(!d.meta.ingresos) d.meta.ingresos = 2850;
  if(!d.meta.presupuesto || d.meta.presupuesto===1500) d.meta.presupuesto = 2850;
  // Default limits — apply to any month that has them at 0 or missing
  var DEFAULT_ALERTAS = {
    casa:391, fijos:760, ocio:500, coche:250,
    inversion:280, regalos:50, pelo:16, otros:50, farmacia:54
  };
  if(!d.alertas) d.alertas = {};
  Object.keys(DEFAULT_ALERTAS).forEach(function(k){
    if(!d.alertas[k] || d.alertas[k]===0) d.alertas[k] = DEFAULT_ALERTAS[k];
  });
  S.months[S.curKey] = d;
  return d;
}
function saveData(d){S.months[S.curKey]=d;saveLocal();renderAll();fbWrite();}

function totals(){
  var t=0;
  var g=cur().gastos;
  Object.keys(g).forEach(function(k){g[k].forEach(function(x){t+=x.importe;});});
  var gas=cur().gasolina||[];gas.forEach(function(x){t+=x.euros||0;});
  return {total:t};
}
function catTot(id){
  var cat=(cur().gastos[id]||[]);
  var t=cat.reduce(function(s,x){return s+x.importe;},0);
  return {total:t};
}
function bankTot(which){
  var items=cur()[which]||[];
  var total=items.reduce(function(s,x){return s+x.importe;},0);
  var paid=items.filter(function(x){return x.pagado;}).reduce(function(s,x){return s+x.importe;},0);
  return {total:total,paid:paid,pending:total-paid};
}
function gasTot(){
  var gas=cur().gasolina||[];
  return gas.reduce(function(s,x){return s+(x.euros||0);},0);
}

function runAdvisor(data){
  var btn = document.getElementById("advisor-btn");
  var result = document.getElementById("advisor-result");
  if(!btn||!result) return;
  btn.disabled = true;
  btn.textContent = "⏳ Analizando tus finanzas...";
  result.style.display = "none";

  var prompt = "Eres un asesor financiero personal experto. Analiza estos datos reales de gastos mensuales de Paulo (España, Vigo) y da consejos muy concretos y personalizados.\n\n"
    +"MES: "+data.mes+"\n"
    +"INGRESOS: "+data.ingresos+"€\n"
    +"TOTAL GASTADO: "+data.total+"€\n"
    +"LIBRE: "+(data.ingresos-data.total)+"€\n\n"
    +"DESGLOSE:\n"
    +"- Necesidades (casa "+fmt((data.catData.casa||{amt:0}).amt)+" + fijos "+fmt((data.catData.fijos||{amt:0}).amt)+" + coche "+fmt((data.catData.coche||{amt:0}).amt)+" + farmacia "+fmt((data.catData.farmacia||{amt:0}).amt)+"): "+fmt(data.nec)+"€ = "+Math.round(data.nec/data.ingresos*100)+"% (objetivo 50%)\n"
    +"- Deseos (ocio "+fmt((data.catData.ocio||{amt:0}).amt)+" + regalos "+fmt((data.catData.regalos||{amt:0}).amt)+" + otros "+fmt((data.catData.otros||{amt:0}).amt)+" + pelo "+fmt((data.catData.pelo||{amt:0}).amt)+"): "+fmt(data.des)+"€ = "+Math.round(data.des/data.ingresos*100)+"% (objetivo 30%)\n"
    +"- Inversión: "+fmt(data.inv)+"€ = "+Math.round(data.inv/data.ingresos*100)+"% (objetivo 20%)\n\n"
    +"CONTEXTO: Paulo tiene deuda estructural alta (hipoteca, préstamos, seguros ~760€/mes en gastos fijos). Ingresos: nómina 2150€ + alquiler piso 700€ = 2850€.\n\n"
    +"Por favor responde con:\n"
    +"1. DIAGNÓSTICO (2-3 líneas sobre su situación real)\n"
    +"2. DÓNDE RECORTAR (2-3 categorías específicas con acciones concretas)\n"
    +"3. DÓNDE PONER MÁS (qué debería aumentar)\n"
    +"4. CONSEJO DEL MES (1 acción concreta y prioritaria)\n"
    +"5. PUNTUACIÓN FINANCIERA (nota /10 con justificación breve)\n\n"
    +"Sé directo, usa los números reales, no des consejos genéricos. Máximo 300 palabras. En español.";

  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:600,
      messages:[{role:"user",content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(res){
    var text=(res.content&&res.content[0]&&res.content[0].text)||"Sin respuesta";
    // Format the response
    var sections = text.split(/\n(?=\d\.)/);
    var html = sections.map(function(s){
      var lines = s.trim().split("\n");
      var title = lines[0];
      var body = lines.slice(1).join("\n").trim();
      var color = title.includes("RECORTAR")?"var(--red)":title.includes("PONER")?"var(--green)":title.includes("DIAGNÓSTICO")?"var(--blue)":title.includes("CONSEJO")?"var(--gold)":"var(--t2)";
      return "<div style='margin-bottom:14px;'>"
        +"<div style='font-size:10px;font-weight:700;color:"+color+";font-family:var(--fm);letter-spacing:1.5px;margin-bottom:6px;'>"+title+"</div>"
        +"<div style='font-size:13px;color:var(--t1);line-height:1.6;'>"+body.replace(/\n/g,"<br>")+"</div>"
        +"</div>";
    }).join("");
    result.innerHTML = "<div style='border-top:1px solid var(--b1);padding-top:16px;'>"+html+"</div>";
    result.style.display = "block";
    btn.disabled = false;
    btn.textContent = "🔄 Actualizar análisis";
  })
  .catch(function(e){
    result.innerHTML = "<div style='color:var(--red);font-size:12px;padding:12px;'>Error al conectar con Claude API: "+e.message+"</div>";
    result.style.display = "block";
    btn.disabled = false;
    btn.textContent = "✨ Reintentar";
  });
}

async function runQATests(){
  var btn=document.getElementById("qa-run-btn");
  var bar=document.getElementById("qa-bar");
  var status=document.getElementById("qa-status");
  var results=document.getElementById("qa-results");
  if(!btn||!results)return;
  btn.disabled=true; btn.textContent="⏳ Ejecutando...";
  var pass=0,fail=0,warn=0;
  var html="";
  for(var i=0;i<QA_TESTS_DEF.length;i++){
    var t=QA_TESTS_DEF[i];
    bar.style.width=Math.round((i/QA_TESTS_DEF.length)*100)+"%";
    status.textContent=(i)+" / "+QA_TESTS_DEF.length+" pruebas";
    await new Promise(function(r){setTimeout(r,150);});
    var r; try{r=t.fn();}catch(e){r={ok:false,d:"Error: "+e.message};}
    var col=r.ok?"#34D399":r.warn?"#FBBF24":"#F87171";
    var badge=r.ok?"✓ PASADA":r.warn?"⚠ ALERTA":"✗ FALLIDA";
    if(r.ok)pass++;else if(r.warn)warn++;else fail++;
    html+="<div style='background:var(--s3);border-radius:10px;padding:11px 14px;margin-bottom:8px;border:1px solid var(--b1);'>"
      +"<div style='display:flex;align-items:center;gap:8px;'>"
      +"<span style='font-size:15px;'>"+t.icon+"</span>"
      +"<span style='font-size:12px;color:var(--t1);font-weight:500;flex:1;'>"+t.name+"</span>"
      +"<span style='font-size:9px;font-family:var(--fm);color:"+col+";font-weight:700;background:"+col+"18;padding:2px 8px;border-radius:4px;'>"+badge+"</span>"
      +"</div>"
      +(r.d?"<div style='font-size:11px;color:"+col+";margin-top:5px;font-family:var(--fm);'>"+r.d+"</div>":"")
      +"</div>";
    results.innerHTML="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;'>"
      +"<div style='text-align:center;background:var(--green2);border-radius:10px;padding:10px;'><div style='font-size:22px;font-weight:700;color:var(--green);'>"+pass+"</div><div style='font-size:9px;color:var(--t3);font-family:var(--fm);'>PASADAS</div></div>"

function getCartera(){
  if(!S.carteraData) S.carteraData = JSON.parse(JSON.stringify(CARTERA_DEFAULTS));
  if(!S.carteraData.fondos)        S.carteraData.fondos = CARTERA_DEFAULTS.fondos;
  if(!S.carteraData.crypto)        S.carteraData.crypto = CARTERA_DEFAULTS.crypto;
  if(!S.carteraData.crypto_prices) S.carteraData.crypto_prices = {};
  return S.carteraData;
}

function saveCartera(){
  S.carteraData = getCartera();
  saveLocal();
  fbWrite();
}

function fetchCryptoPrices(){
  var ct = getCartera();
  var coins = ct.crypto.map(function(c){return c.coin;}).filter(function(c){
    return ["bitcoin","ethereum","solana","pepe","usd-coin"].indexOf(c)>=0;
  }).join(",");
  // Also try lighter
  var url = "https://api.coingecko.com/api/v3/simple/price?ids="+coins+"&vs_currencies=eur&include_24hr_change=true&include_market_cap=false";
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      ct.crypto_prices = data;
      ct.last_update = new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
      S.carteraData = ct;
      saveCartera();
      var el=document.getElementById("finanp-body");
      if(el) el.innerHTML = buildFinanPBody();
    })
    .catch(function(){
      var el=document.getElementById("finanp-price-status");
      if(el) el.textContent="Sin conexión — mostrando último precio";
    });
}

function renderResumen(){
  var p=S.curKey.split("-");
  var mlbl=(MESES[parseInt(p[1])-1]+" "+p[0]).toUpperCase();
  var meta=cur().meta||{presupuesto:2850,bote:0,ingresos:2850};
  var ingresos=meta.ingresos||2850;
  var bk=bankTot("bankinter"),sb=bankTot("sabadell");
  var gasT=gasTot();
  var ap=cur().apuestas||{};

  // ── Calculate totals by 50/30/20 block ──
  var catTots={};
  cats().forEach(function(cat){
    var amt=catTot(cat.id).total;
    if(cat.id==="coche") amt+=gasT;
    catTots[cat.id]=amt;
  });

  var necesidades=(catTots.casa||0)+(catTots.fijos||0)+(catTots.coche||0)+(catTots.farmacia||0);
  var deseos=(catTots.ocio||0)+(catTots.regalos||0)+(catTots.otros||0)+(catTots.pelo||0);
  var inversion=(catTots.inversion||0);
  var total=necesidades+deseos+inversion;

  // 50/30/20 targets
  var t50=ingresos*0.50, t30=ingresos*0.30, t20=ingresos*0.20;
  var pct50=t50>0?Math.min(100,(necesidades/t50)*100):0;
  var pct30=t30>0?Math.min(100,(deseos/t30)*100):0;
  var pct20=t20>0?Math.min(100,(inversion/t20)*100):0;

  function blockColor(pct){return pct>100?"var(--red)":pct>80?"var(--amber)":"var(--green)";}
  function blockStatus(pct){return pct>100?"EXCEDIDO":pct>80?"ATENCIÓN":"OK";}

  var h='';

  // ── HERO: total + progress bar ──
  var presupuesto=meta.presupuesto||2850;
  var pctTotal=presupuesto>0?Math.min(100,(total/presupuesto)*100):0;
  var totalBarColor=pctTotal>90?"var(--red)":pctTotal>70?"var(--amber)":"var(--green)";

  h+='<div style="background:var(--s1);border-radius:18px;border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;">'
    // Top: month + total
    +'<div style="padding:20px 18px 16px;">'
    +'<div style="font-size:9px;color:var(--t3);letter-spacing:3px;font-family:var(--fm);margin-bottom:10px;">'+mlbl+'</div>'
    +'<div style="font-size:40px;font-weight:700;letter-spacing:-1.5px;color:var(--t1);line-height:1;margin-bottom:4px;">'+fmt(total)+'</div>'
    +'<div style="font-size:12px;color:var(--t3);margin-bottom:16px;">de '+fmt(presupuesto)+' presupuestados</div>'
    +'<div style="background:var(--s3);border-radius:4px;height:4px;overflow:hidden;margin-bottom:8px;">'

function addCat(){
  var emoji=document.getElementById("nc-emoji").value;
  var label=(document.getElementById("nc-name").value||"").trim();
  var color=document.getElementById("nc-color").value;
  if(!label)return;
  var id="custom_"+uid();
  if(!S.customCats)S.customCats=[];
  S.customCats.push({id:id,label:label,emoji:emoji,color:color});
  Object.keys(S.months).forEach(function(k){
    if(!S.months[k].gastos[id])S.months[k].gastos[id]=[];
  });
  document.getElementById("nc-name").value="";
  saveLocal();fbWrite();renderAll();
}
function delCat(id){
  var d=cur();pushUndo(d,"Categoría borrada");
  S.customCats=(S.customCats||[]).filter(function(c){return c.id!==id;});
  if(S.tab===id)S.tab="resumen";
  saveLocal();fbWrite();renderAll();
}

// ─── CRUD básico (gastos por categoría) ──────────────────────────────────────
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function startEdit(id,sec,enc){
  S.editId=id;S.editSec=sec;
  try{S.editRow=JSON.parse(decodeURIComponent(enc));}catch(e){S.editRow={};}
  renderContent();
}
function cancelEdit(){S.editId=null;renderContent();}
function saveEdit(catId,id){
  var imp=parseFloat(String(S.editRow.importe).replace(",","."));
  if(isNaN(imp))return;
  var d=cur();
  d.gastos[catId]=d.gastos[catId].map(function(g){
    return g.id===id?Object.assign({},g,{concepto:S.editRow.concepto,importe:imp,nota:S.editRow.nota||""}):g;
  });
  S.editId=null;saveData(d);
}
function delGasto(catId,id){
  var d=cur();var deleted=d.gastos[catId].find(function(g){return g.id===id;});
  pushUndo(d,"Gasto borrado: "+(deleted?deleted.concepto:""));
  d.gastos[catId]=d.gastos[catId].filter(function(g){return g.id!==id;});saveData(d);
}
function addGasto(catId){
  var imp=parseFloat(String(S.newRow.importe).replace(",","."));
  if(!S.newRow.concepto||isNaN(imp)||imp<0)return;
  var d=cur();
  if(!d.gastos[catId])d.gastos[catId]=[];
  d.gastos[catId].push({id:uid(),concepto:S.newRow.concepto,importe:imp,nota:S.newRow.nota||""});
  S.newRow={concepto:"",importe:""};saveData(d);
}

// ─── GRÁFICAS (pure canvas, no dependencies) ─────────────────────────────────
var chartInstances={};
function destroyChart(id){} // no-op, canvas is replaced by innerHTML

function renderGraficas(){
  var keys=Object.keys(S.months).sort();
  var p=S.curKey.split("-");
  var curMes=MESES[parseInt(p[1])-1].toUpperCase();
  var allCats=cats();
  var d=cur();
  var gasT=gasTot();

  if(keys.length===0) return '<div class="card"><div style="padding:40px;text-align:center;color:var(--t3);font-size:12px;letter-spacing:1px;">SIN DATOS AÚN</div></div>';

  var labels=keys.map(function(k){var p=k.split("-");return MESES[parseInt(p[1])-1].slice(0,3).toUpperCase()+"\u00a0"+p[0].slice(2);});

  // ── helpers ──────────────────────────────────────────────────────────────
  function fmtK(v){return v>=1000?(v/1000).toFixed(1)+"K":Math.round(v);}
  function svgCard(title, color, svgContent){
    return "<div class='card' style='margin-bottom:12px;overflow:hidden;'>"
      +"<div style='padding:14px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;'>"
      +"<div style='width:3px;height:14px;border-radius:2px;background:"+color+";flex-shrink:0;'></div>"
      +"<span style='font-size:10px;letter-spacing:2.5px;font-family:var(--fm);color:var(--t2);font-weight:600;'>"+title+"</span>"
      +"</div>"
      +"<div style='padding:16px;'>"+svgContent+"</div>"
      +"</div>";
  }

  // ── CHART 1: Line chart — monthly spending evolution ─────────────────────
  var monthTotals=keys.map(function(k){
    var tot=allCats.reduce(function(s,cat){return s+(S.months[k].gastos&&S.months[k].gastos[cat.id]||[]).reduce(function(s2,x){return s2+x.importe;},0);},0);
    // add gasolina
    ((S.months[k].gasolina)||[]).forEach(function(x){tot+=x.euros||0;});
    return tot;
  });
  var W=320,H=160,PL=44,PR=12,PT=12,PB=32;
  var CW=W-PL-PR,CH=H-PT-PB;
  var maxV=Math.max.apply(null,monthTotals.concat([1]));
  var minV=0;
  var yScale=function(v){return PT+CH-((v-minV)/(maxV-minV))*CH;};
  var xPos=function(i){return PL+i*(CW/(Math.max(keys.length-1,1)));};

  // Grid
  var grid="";
  [0,.25,.5,.75,1].forEach(function(f){
    var y=PT+CH*f;
    var val=fmtK(maxV*(1-f));
    grid+="<line x1='"+PL+"' y1='"+y.toFixed(0)+"' x2='"+(W-PR)+"' y2='"+y.toFixed(0)+"' stroke='rgba(255,255,255,.05)' stroke-width='1'/>";
    grid+="<text x='"+(PL-4)+"' y='"+(y+3).toFixed(0)+"' text-anchor='end' font-size='8' fill='rgba(255,255,255,.3)' font-family='monospace'>"+val+"</text>";
  });

  // Area fill
  var pts=keys.map(function(k,i){return xPos(i).toFixed(1)+","+yScale(monthTotals[i]).toFixed(1);});
  var area="M"+pts[0];
  pts.slice(1).forEach(function(p){area+=" L"+p;});
  var areaFill=area+" L"+(W-PR)+","+(PT+CH)+" L"+PL+","+(PT+CH)+" Z";

  // Line
  var linePath="M"+pts[0];
  pts.slice(1).forEach(function(p){linePath+=" L"+p;});

  // Dots + labels
  var dots="";
  keys.forEach(function(k,i){
    var cx=xPos(i).toFixed(1),cy=yScale(monthTotals[i]).toFixed(1);
    var isCur=k===S.curKey;
    dots+="<circle cx='"+cx+"' cy='"+cy+"' r='"+(isCur?5:3)+"' fill='"+(isCur?"var(--blue)":"rgba(79,142,247,.8)")+"' stroke='var(--s0)' stroke-width='2'/>";
    if(isCur||keys.length<=6){
      dots+="<text x='"+cx+"' y='"+(parseFloat(cy)-8)+"' text-anchor='middle' font-size='8' fill='rgba(255,255,255,.7)' font-family='monospace'>"+fmtK(monthTotals[i])+"</text>";
    }
    dots+="<text x='"+cx+"' y='"+(H-PB+14)+"' text-anchor='middle' font-size='8' fill='rgba(255,255,255,.35)' font-family='monospace'>"+labels[i]+"</text>";
  });

  var svgLine="<svg viewBox='0 0 "+W+" "+H+"' style='width:100%;display:block;'>"
    +"<defs><linearGradient id='lg1' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#4F8EF7' stop-opacity='.25'/><stop offset='100%' stop-color='#4F8EF7' stop-opacity='.02'/></linearGradient></defs>"
    +grid
    +"<path d='"+areaFill+"' fill='url(#lg1)'/>"
    +"<path d='"+linePath+"' fill='none' stroke='#4F8EF7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>"
    +dots
    +"</svg>";

  // ── Monthly summary text below chart ──────────────────────────────────────
  var monthSummary = keys.slice(-6).map(function(k){
    var mt = monthTotals[keys.indexOf(k)];
    var pp = k.split("-");
    var mlbl = MESES[parseInt(pp[1])-1].slice(0,3)+"-"+pp[0].slice(2);
    var d = S.months[k];
    var ingresos = (d.meta&&d.meta.ingresos)||2850;
    var pct = ingresos>0?Math.round(mt/ingresos*100):0;
    var col = pct>90?"#F87171":pct>70?"#FBBF24":"#34D399";
    return "<div style='display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);'>"      +"<span style='font-size:10px;color:rgba(255,255,255,.4);font-family:var(--fm);min-width:48px;'>"+mlbl+"</span>"      +"<div style='flex:1;margin:0 10px;background:rgba(255,255,255,.06);border-radius:4px;height:6px;overflow:hidden;'>"      +"<div style='height:6px;border-radius:4px;background:"+col+";width:"+Math.min(100,pct)+"%;'></div></div>"      +"<span style='font-size:11px;font-weight:700;color:#F8FAFC;min-width:70px;text-align:right;'>"+fmt(mt)+"</span>"      +"<span style='font-size:10px;color:"+col+";font-family:var(--fm);min-width:36px;text-align:right;'>"+pct+"%</span>"      +"</div>";
  }).join("");
  svgLine = svgLine + "<div style='margin-top:12px;'><div style='font-size:9px;color:rgba(255,255,255,.3);letter-spacing:2px;font-family:var(--fm);margin-bottom:6px;'>ÚLTIMOS 6 MESES</div>"+monthSummary+"</div>";

  // ── CHART 2: Category breakdown — HTML rows (readable on mobile) ──────────
  var catAmts=allCats.map(function(cat){
    var v=(d.gastos[cat.id]||[]).reduce(function(s,x){return s+x.importe;},0);
    if(cat.id==="coche") v+=gasT;
    return{cat:cat,v:v};
  }).filter(function(r){return r.v>0;}).sort(function(a,b){return b.v-a.v;});

  var totalCatAmts=catAmts.reduce(function(s,r){return s+r.v;},0);
  var maxCat=catAmts.length>0?catAmts[0].v:1;

  var svgBars=catAmts.map(function(r){
    var pct=totalCatAmts>0?Math.round(r.v/totalCatAmts*100):0;
    var barPct=Math.round(r.v/maxCat*100);
    var lim=(d.alertas||{})[r.cat.id]||0;
    var limTxt=lim>0?"/ "+fmt(lim):"";
    var over=lim>0&&r.v>lim;
    return "<div style='margin-bottom:14px;'>"
      // Name + amount row
      +"<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;'>"
      +"<div style='display:flex;align-items:center;gap:8px;'>"
      +"<div style='width:10px;height:10px;border-radius:3px;background:"+r.cat.color+";flex-shrink:0;'></div>"
      +"<span style='font-size:13px;color:#F8FAFC;font-weight:600;'>"+r.cat.label+"</span>"
      +(over?"<span style='font-size:9px;color:var(--red);font-family:var(--fm);background:var(--red2);padding:2px 6px;border-radius:4px;'>EXCEDIDO</span>":"")
      +"</div>"
      +"<div style='text-align:right;'>"
      +"<span style='font-size:14px;font-weight:700;color:#F8FAFC;'>"+fmt(r.v)+"</span>"
      +(limTxt?"<span style='font-size:11px;color:rgba(255,255,255,.3);margin-left:4px;'>"+limTxt+"</span>":"")
      +"</div>"
      +"</div>"
      // Bar
      +"<div style='display:flex;align-items:center;gap:8px;'>"
      +"<div style='flex:1;background:rgba(255,255,255,.07);border-radius:6px;height:10px;overflow:hidden;'>"
      +"<div style='height:10px;border-radius:6px;background:"+r.cat.color+";width:"+barPct+"%;transition:width .5s;'></div>"
      +"</div>"
      +"<span style='font-size:11px;color:"+r.cat.color+";font-weight:700;font-family:var(--fm);width:32px;text-align:right;'>"+pct+"%</span>"
      +"</div>"
      +"</div>";
  }).join("")||"<div style='text-align:center;padding:20px;color:rgba(255,255,255,.3);font-size:12px;'>Sin gastos este mes</div>";

  // ── CHART 3: Donut — distribution ────────────────────────────────────────
  var totalD=catAmts.reduce(function(s,r){return s+r.v;},0);
  var DW=320,DH=200,DR=70,IR=42,CX=100,CY=100;
  var angle=-Math.PI/2;
  var paths=catAmts.slice(0,8).map(function(r){
    var sweep=(r.v/totalD)*Math.PI*2;
    var x1=CX+DR*Math.cos(angle),y1=CY+DR*Math.sin(angle);
    var x2=CX+DR*Math.cos(angle+sweep),y2=CY+DR*Math.sin(angle+sweep);
    var ix1=CX+IR*Math.cos(angle+sweep),iy1=CY+IR*Math.sin(angle+sweep);
    var ix2=CX+IR*Math.cos(angle),iy2=CY+IR*Math.sin(angle);
    var lf=sweep>Math.PI?1:0;
    var path="<path d='M"+x1.toFixed(1)+" "+y1.toFixed(1)
      +" A"+DR+" "+DR+" 0 "+lf+" 1 "+x2.toFixed(1)+" "+y2.toFixed(1)
      +" L"+ix1.toFixed(1)+" "+iy1.toFixed(1)
      +" A"+IR+" "+IR+" 0 "+lf+" 0 "+ix2.toFixed(1)+" "+iy2.toFixed(1)
      +" Z' fill='"+r.cat.color+"' stroke='var(--s0)' stroke-width='2'/>";
    angle+=sweep;
    return path;
  }).join("");

  var center="<text x='"+CX+"' y='"+(CY-7)+"' text-anchor='middle' font-size='9' fill='rgba(255,255,255,.4)' font-family='monospace'>TOTAL</text>"
    +"<text x='"+CX+"' y='"+(CY+10)+"' text-anchor='middle' font-size='14' font-weight='700' fill='#F8FAFC' font-family='system-ui'>"+fmt(totalD)+"</text>";

  var legend=catAmts.slice(0,8).map(function(r,i){
    var ly=12+i*22;
    if(ly>DH-16)return "";
    return "<rect x='185' y='"+ly+"' width='8' height='8' rx='2' fill='"+r.cat.color+"'/>"
      +"<text x='197' y='"+(ly+8)+"' font-size='9' fill='rgba(255,255,255,.65)' font-family='monospace'>"+r.cat.label.slice(0,10).toUpperCase()+"</text>"
      +"<text x='"+(DW-6)+"' y='"+(ly+8)+"' text-anchor='end' font-size='9' fill='"+r.cat.color+"' font-family='monospace' font-weight='700'>"+Math.round(r.v/totalD*100)+"%</text>";
  }).join("");

  var svgDonut=totalD>0
    ?"<svg viewBox='0 0 "+DW+" "+DH+"' style='width:100%;display:block;'>"+paths+center+legend+"</svg>"
    :"<div style='text-align:center;padding:30px;color:var(--t3);font-size:12px;'>Sin gastos este mes</div>";

  // ── CHART 4: 50/30/20 gauge bars ─────────────────────────────────────────
  var ingresos=(d.meta&&d.meta.ingresos)||2850;
  var nec=(d.gastos.casa||[]).reduce(function(s,x){return s+x.importe;},0)
    +(d.gastos.fijos||[]).reduce(function(s,x){return s+x.importe;},0)
    +(d.gastos.coche||[]).reduce(function(s,x){return s+x.importe;},0)+gasT
    +(d.gastos.farmacia||[]).reduce(function(s,x){return s+x.importe;},0);
  var des=(d.gastos.ocio||[]).reduce(function(s,x){return s+x.importe;},0)
    +(d.gastos.regalos||[]).reduce(function(s,x){return s+x.importe;},0)
    +(d.gastos.otros||[]).reduce(function(s,x){return s+x.importe;},0)
    +(d.gastos.pelo||[]).reduce(function(s,x){return s+x.importe;},0);
  var inv=(d.gastos.inversion||[]).reduce(function(s,x){return s+x.importe;},0);

  function gaugeBlock(emoji,label,desc,spent,target,color){
    var pct = target>0 ? spent/target*100 : 0;
    var barPct = Math.min(100,pct);
    var over = pct>100;
    var statusCol = pct>100?"var(--red)":pct>80?"var(--amber)":"var(--green)";
    var statusTxt = pct>100?"⚠ "+fmt(spent-target)+" de exceso":pct>80?"Atención — cerca del límite":"Dentro del objetivo";
    return "<div style='background:rgba(255,255,255,.03);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);'>"
      // Header row
      +"<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;'>"
      +"<div style='display:flex;align-items:center;gap:8px;'>"
      +"<div style='width:12px;height:12px;border-radius:3px;background:"+color+";'></div>"
      +"<span style='font-size:14px;font-weight:700;color:#F8FAFC;'>"+label+"</span>"
      +"</div>"
      +"<span style='font-size:9px;color:rgba(255,255,255,.35);font-family:var(--fm);'>objetivo: "+fmt(target)+"</span>"
      +"</div>"
      // Description
      +"<div style='font-size:11px;color:rgba(255,255,255,.35);margin-bottom:10px;'>"+desc+"</div>"
      // Amount
      +"<div style='display:flex;align-items:baseline;gap:6px;margin-bottom:10px;'>"
      +"<span style='font-size:22px;font-weight:700;color:"+statusCol+";letter-spacing:-.5px;'>"+fmt(spent)+"</span>"
      +"<span style='font-size:12px;color:rgba(255,255,255,.3);'>gastado este mes</span>"
      +"</div>"
      // Bar
      +"<div style='background:rgba(255,255,255,.07);border-radius:8px;height:12px;overflow:hidden;margin-bottom:8px;position:relative;'>"
      +"<div style='height:12px;border-radius:8px;background:"+color+";width:"+barPct.toFixed(1)+"%;transition:width .6s;"+(over?"opacity:1;":"opacity:.85;")+";'></div>"
      +(over?"<div style='position:absolute;top:0;left:"+Math.min(98,barPct-2)+"%;width:2px;height:12px;background:#fff;opacity:.6;'></div>":"")
      +"</div>"
      // Status
      +"<div style='display:flex;justify-content:space-between;align-items:center;'>"
      +"<span style='font-size:11px;color:"+statusCol+";font-weight:600;'>"+statusTxt+"</span>"
      +"<span style='font-size:12px;font-weight:700;color:"+statusCol+";font-family:var(--fm);'>"+pct.toFixed(0)+"%</span>"
      +"</div>"
      +"</div>";
  }

  var svgGauge = "<div style='font-size:11px;color:rgba(255,255,255,.3);text-align:center;margin-bottom:14px;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;line-height:1.6;'>"
    +"Ingresos: <strong style='color:#F8FAFC;'>"+fmt(ingresos)+"</strong> · "
    +"Gastado total: <strong style='color:#F8FAFC;'>"+(fmt(nec+des+inv))+"</strong> · "
    +"Libre: <strong style='color:var(--green);'>"+fmt(ingresos-nec-des-inv)+"</strong>"
    +"</div>"
    +gaugeBlock("🏠","Necesidades","Casa, fijos, coche, farmacia",nec,ingresos*.5,"#4F8EF7")
    +gaugeBlock("🎯","Deseos","Ocio, regalos, peluquería, otros",des,ingresos*.3,"#FBBF24")
    +gaugeBlock("📈","Inversión","Fondos, crypto, ahorro",inv,ingresos*.2,"#34D399");

  // ── CHART 5: Apuestas P&L bar chart ──────────────────────────────────────
  var apData=keys.map(function(k){return(S.months[k].apuestas&&S.months[k].apuestas.balance_mes)||0;});
  var apMax=Math.max.apply(null,apData.map(Math.abs).concat([1]));
  var AW=320,AH=140,APL=40,APR=12,APT=10,APB=28;
  var ACW=AW-APL-APR,ACH=AH-APT-APB;
  var midY=APT+ACH/2;
  var abw=Math.min(24,ACW/keys.length*.6);
  var asp=ACW/Math.max(keys.length,1);

  var aGrid="<line x1='"+APL+"' y1='"+midY+"' x2='"+(AW-APR)+"' y2='"+midY+"' stroke='rgba(255,255,255,.15)' stroke-width='1'/>"
    +"<text x='"+(APL-4)+"' y='"+(midY+3)+"' text-anchor='end' font-size='8' fill='rgba(255,255,255,.3)' font-family='monospace'>0</text>";

  var aBars=keys.map(function(k,i){
    var cx=APL+i*asp+asp/2;
    var v=apData[i];
    var bh=Math.max(2,Math.abs(v)/apMax*(ACH/2));
    var by=v>=0?midY-bh:midY;
    var col=v>=0?"#34D399":"#F87171";
    return "<rect x='"+(cx-abw/2).toFixed(1)+"' y='"+by.toFixed(1)+"' width='"+abw+"' height='"+bh.toFixed(1)+"' fill='"+col+"' rx='3'/>"
      +(Math.abs(v)>0?"<text x='"+cx.toFixed(1)+"' y='"+(v>=0?by-3:by+bh+10).toFixed(1)+"' text-anchor='middle' font-size='8' fill='"+col+"' font-family='monospace'>"+Math.round(v)+"</text>":"")
      +"<text x='"+cx.toFixed(1)+"' y='"+(AH-APB+13)+"' text-anchor='middle' font-size='8' fill='rgba(255,255,255,.3)' font-family='monospace'>"+labels[i]+"</text>";
  }).join("");

  var svgAp="<svg viewBox='0 0 "+AW+" "+AH+"' style='width:100%;display:block;'>"+aGrid+aBars+"</svg>";

  return svgCard("EVOLUCIÓN MENSUAL · "+keys.length+" MESES","#4F8EF7",svgLine)
    +svgCard("DISTRIBUCIÓN · "+curMes,"#C084FC",svgDonut)
    +svgCard("DESGLOSE POR CATEGORÍA","#34D399",svgBars)
    +svgCard("REGLA 50/30/20 · "+curMes,"#FBBF24",svgGauge)
    +svgCard("EVOLUCIÓN APUESTAS","#F87171",svgAp);
}

function initCharts(){} // no-op



// ─── AHORRO Y ALERTAS ────────────────────────────────────────────────────────
function renderAhorro(){
  var d=cur();
  var meta=d.meta||{presupuesto:2850,bote:0,ingresos:2850};
  var ingresos=meta.ingresos||2850;
  var gasT=gasTot();
  var total=0;
  cats().forEach(function(cat){
    var amt=catTot(cat.id).total;
    if(cat.id==="coche") amt+=gasT;
    total+=amt;
  });
  var ahorro=ingresos-total;
  var pct=ingresos>0?Math.min(100,(total/ingresos)*100):0;
  var barColor=pct>90?"var(--red)":pct>70?"var(--amber)":"var(--green)";
  var boteTotal=Object.keys(S.months).reduce(function(s,k){return s+((S.months[k].meta&&S.months[k].meta.bote)||0);},0);
  var alertas=d.alertas||{};
  var p=S.curKey.split("-");
  var mlbl=(MESES[parseInt(p[1])-1]+" "+p[0]).toUpperCase();

  // Build alerts
  var alertHTML="";
  cats().forEach(function(cat){
    var lim=alertas[cat.id]||0;
    var amt=catTot(cat.id).total;
    if(cat.id==="coche") amt+=gasT;
    if(lim>0&&amt>=lim*0.8){
      var over=amt>=lim;
      var color=over?"var(--red)":"var(--amber)";
      var bg=over?"var(--red2)":"rgba(251,191,36,.08)";
      alertHTML+="<div style='display:flex;align-items:center;gap:10px;padding:10px 12px;background:"+bg+";border-radius:10px;margin-bottom:6px;'>"
        +"<div style='width:6px;height:6px;border-radius:50%;background:"+color+";flex-shrink:0;'></div>"
        +"<span style='font-size:12px;color:"+color+";flex:1;'>"+cat.label+": "+fmt(amt)+" / "+fmt(lim)+"</span>"
        +(over?"<span style='font-size:10px;color:var(--red);font-family:var(--fm);font-weight:700;'>EXCEDIDO</span>":"<span style='font-size:10px;color:var(--amber);font-family:var(--fm);'>80%+</span>")
        +"</div>";
    }
  });

  var h="";

  // Main budget card
  h+="<div style='background:var(--s1);border-radius:18px;border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;'>"
    +"<div style='padding:20px 18px;'>"
    +"<div style='font-size:9px;color:var(--t3);letter-spacing:3px;font-family:var(--fm);margin-bottom:12px;'>"+mlbl+"</div>"
    +"<div style='display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;'>"
    +"<div><div style='font-size:11px;color:var(--t3);font-family:var(--fm);margin-bottom:4px;'>INGRESOS</div>"
    +"<div style='font-size:28px;font-weight:700;color:var(--green);letter-spacing:-.5px;'>"+fmt(ingresos)+"</div></div>"
    +"<div style='text-align:right;'><div style='font-size:11px;color:var(--t3);font-family:var(--fm);margin-bottom:4px;'>GASTADO</div>"
    +"<div style='font-size:28px;font-weight:700;color:"+barColor+";letter-spacing:-.5px;'>"+fmt(total)+"</div></div>"
    +"</div>"
    +"<div style='background:rgba(255,255,255,.08);border-radius:8px;height:14px;overflow:hidden;margin-bottom:8px;position:relative;'>"
    +"<div style='height:14px;border-radius:8px;background:"+barColor+";width:"+pct.toFixed(1)+"%;transition:width .5s;'></div>"
    +"</div>"
    +"<div style='display:flex;justify-content:space-between;'>"
    +"<span style='font-size:11px;color:"+barColor+";font-weight:700;font-family:var(--fm);'>"+pct.toFixed(0)+"%</span>"
    +"<span style='font-size:11px;color:var(--t3);font-family:var(--fm);'>"+(ahorro>=0?fmt(ahorro)+" libre":fmt(Math.abs(ahorro))+" excedido")+"</span>"
    +"</div>"
    +"<div style='margin-top:16px;padding:16px;background:var(--s3);border-radius:14px;text-align:center;'>"
    +(ahorro>=0
      ?"<div style='font-size:10px;color:var(--green);letter-spacing:3px;font-family:var(--fm);margin-bottom:6px;'>AHORRO ESTE MES</div>"
       +"<div style='font-size:36px;font-weight:700;color:var(--green);letter-spacing:-1px;'>+"+fmt(ahorro)+"</div>"
      :"<div style='font-size:10px;color:var(--red);letter-spacing:3px;font-family:var(--fm);margin-bottom:6px;'>EXCEDIDO</div>"
       +"<div style='font-size:36px;font-weight:700;color:var(--red);letter-spacing:-1px;'>"+fmt(ahorro)+"</div>"
    )
    +"</div>"
    +"<div style='display:flex;align-items:center;justify-content:space-between;margin-top:14px;'>"
    +"<span style='font-size:12px;color:var(--t3);'>Ingresos del mes</span>"
    +"<input class='inline-in' type='number' id='meta-ingresos' value='"+ingresos+"' style='width:90px;' onchange='updateMeta(\"ingresos\",this.value)'>"
    +"</div>"
    +"</div></div>";

  // Bote inversión
  h+="<div style='background:linear-gradient(135deg,#052814,#061A10);border-radius:18px;border:1px solid rgba(52,211,153,.2);margin-bottom:12px;'>"
    +"<div style='padding:18px;'>"
    +"<div style='font-size:9px;color:var(--green);letter-spacing:3px;font-family:var(--fm);margin-bottom:10px;'>BOTE DE INVERSIÓN ACUMULADO</div>"
    +"<div style='font-size:36px;font-weight:700;color:var(--green);letter-spacing:-1px;margin-bottom:14px;'>"+fmt(boteTotal)+"</div>"
    +"<div style='display:flex;gap:8px;'>"
    +(ahorro>0?"<button onclick='addBote("+ahorro.toFixed(2)+")' style='flex:1;background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:10px 6px;font-size:12px;cursor:pointer;font-weight:600;'>+ Añadir "+fmt(ahorro)+"</button>":"")
    +"<button onclick='addBoteManual()' style='flex:1;background:var(--s3);color:var(--t3);border:1px solid var(--b2);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;'>+ Manual</button>"
    +"</div></div></div>";

  // Alerts
  if(alertHTML){
    h+="<div style='background:var(--s1);border-radius:18px;border:1px solid var(--b1);margin-bottom:12px;padding:16px;'>"
      +"<div style='font-size:9px;color:var(--t3);letter-spacing:3px;font-family:var(--fm);margin-bottom:12px;'>ALERTAS</div>"
      +alertHTML+"</div>";
  }

  // Limits per category
  h+="<div style='background:var(--s1);border-radius:18px;border:1px solid var(--b1);overflow:hidden;'>"
    +"<div style='padding:14px 18px;border-bottom:1px solid var(--b1);'>"
    +"<div style='font-size:9px;color:var(--t3);letter-spacing:3px;font-family:var(--fm);margin-bottom:2px;'>LÍMITES POR CATEGORÍA</div>"
    +"<div style='font-size:11px;color:var(--t3);'>Alerta al 80% y 100%. 0 = desactivado.</div>"
    +"</div>";

  cats().forEach(function(cat){
    var lim=alertas[cat.id]||0;
    var amt=catTot(cat.id).total;
    if(cat.id==="coche") amt+=gasT;
    var pctC=lim>0?Math.min(100,(amt/lim)*100):0;
    var bc=pctC>=100?"var(--red)":pctC>=80?"var(--amber)":"var(--blue)";
    h+="<div style='display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--b1);gap:10px;cursor:pointer;' onclick='setTab(\"" + cat.id + "\")'>"
      +"<svg width='14' height='14' viewBox='0 0 14 14' fill='none'><rect width='14' height='14' rx='4' fill='"+cat.color+"' opacity='.8'/></svg>"
      +"<span style='font-size:12px;color:var(--t2);flex:1;font-weight:500;'>"+cat.label+"</span>"
      +(lim>0?"<div style='flex:1;margin:0 10px;'>"
        +"<div style='display:flex;justify-content:space-between;margin-bottom:4px;'>"
        +"<span style='font-size:9px;color:rgba(255,255,255,.4);font-family:var(--fm);'>"+fmt(amt)+" / "+fmt(lim)+"</span>"
        +"<span style='font-size:10px;color:"+bc+";font-family:var(--fm);font-weight:700;'>"+pctC.toFixed(0)+"%</span>"
        +"</div>"
        +"<div style='background:rgba(255,255,255,.08);border-radius:6px;height:8px;overflow:hidden;'>"
        +"<div style='height:8px;border-radius:6px;background:"+bc+";width:"+Math.min(100,pctC).toFixed(0)+"%;transition:width .4s;'></div>"
        +"</div></div>":"")
      +"<div style='text-align:right;'>"

      +"<input class='inline-in' type='number' placeholder='0' id='alim-"+cat.id+"' value='"+(lim||"")+"' style='width:80px;' onchange='updateAlerta(\""+cat.id+"\",this.value)'>"
      +"</div></div>";
  });
  h+="</div>";

  return h;
}


function updateAlertaById(inp){
  var catId = inp.id.replace('lim-','');
  updateAlerta(catId, inp.value);
}
function updateMeta(key,val){var d=cur();if(!d.meta)d.meta={presupuesto:2000,bote:0};d.meta[key]=parseFloat(val)||0;saveData(d);}
function addBote(amount){var d=cur();if(!d.meta)d.meta={presupuesto:2000,bote:0};d.meta.bote=(d.meta.bote||0)+amount;saveData(d);}

function renderGasolina(){
  var gas=cur().gasolina||[];
  var totalE=gas.reduce(function(s,x){return s+(x.euros||0);},0);
  var totalL=gas.reduce(function(s,x){return s+(x.litros||0);},0);
  var totalKms=gas.reduce(function(s,x){return s+(x.kms||0);},0);
  var lastKm=gas.length?gas[gas.length-1].km_total:0;
  var avgPrice=totalL>0?totalE/totalL:0;
  var rh=gas.map(function(g){
    if(S.editId===g.id){
      return '<div class="xrow"><div class="erow" style="flex-wrap:wrap;gap:6px;">'
        +'<input class="ei" style="width:90px;" placeholder="Fecha" value="'+esc(g.fecha)+'" oninput="S.editRow.fecha=this.value">'
        +'<input class="ei n" placeholder="€/L" value="'+g.precio+'" oninput="S.editRow.precio=this.value">'
        +'<input class="ei n" placeholder="€" value="'+g.euros+'" oninput="S.editRow.euros=this.value">'
        +'<input class="ei n" placeholder="L" value="'+g.litros+'" oninput="S.editRow.litros=this.value">'
        +'<input class="ei n" placeholder="km" value="'+g.kms+'" oninput="S.editRow.kms=this.value">'
        +'<input class="ei n" placeholder="km total" value="'+g.km_total+'" oninput="S.editRow.km_total=this.value">'
        +'<button class="ei" style="background:#27ae60;color:#fff;border:none;cursor:pointer;" onclick="saveGasEdit(\''+g.id+'\')">✓</button>'
        +'<button class="ei" style="background:#333;color:#888;border:none;cursor:pointer;" onclick="cancelEdit()">✕</button>'
        +'</div></div>';
    }
    return '<div class="xrow"><div style="padding:10px 14px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
      +'<span style="font-size:13px;color:#C0B8A8;">⛽ '+esc(g.fecha)+'</span>'
      +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<span style="font-size:15px;font-weight:bold;color:#C17D3C;">'+fmt(g.euros)+'</span>'
      +'<button class="ibt" onclick="startEdit(\''+g.id+'\',\'gas\',\''+encodeURIComponent(JSON.stringify(g))+'\')">✏️</button>'
      +'<button class="ibt" onclick="delGas(\''+g.id+'\')">🗑️</button>'
      +'</div></div>'

      +'<span style="background:#070718;border-radius:6px;padding:3px 8px;font-size:10px;color:#888;">'+g.precio+'€/L</span>'
      +'<span style="background:#070718;border-radius:6px;padding:3px 8px;font-size:10px;color:#888;">'+g.litros+'L</span>'
      +'<span style="background:#070718;border-radius:6px;padding:3px 8px;font-size:10px;color:#888;">'+g.kms+' km</span>'
      +'<span style="background:#070718;border-radius:6px;padding:3px 8px;font-size:10px;color:#666;">'+g.km_total+' km total</span>'
      +'</div></div></div>';
  }).join("");

    +'<div class="lbl" style="color:#C17D3C;margin-bottom:12px;">⛽ RESUMEN GASOLINA</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    +'<div style="flex:1;min-width:70px;background:#070718;border-radius:10px;padding:10px;text-align:center;">'
    +'<div style="font-size:9px;color:#555;letter-spacing:1px;">TOTAL</div><div style="font-size:18px;font-weight:bold;color:var(--text);">'+fmt(totalE)+'</div></div>'
    +'<div style="flex:1;min-width:70px;background:#070718;border-radius:10px;padding:10px;text-align:center;">'
    +'<div style="font-size:9px;color:#555;letter-spacing:1px;">LITROS</div><div style="font-size:18px;font-weight:bold;color:var(--text);">'+totalL.toFixed(1)+'L</div></div>'
    +'<div style="flex:1;min-width:70px;background:#070718;border-radius:10px;padding:10px;text-align:center;">'
    +'<div style="font-size:9px;color:#555;letter-spacing:1px;">KMS</div><div style="font-size:18px;font-weight:bold;color:var(--text);">'+totalKms+'</div></div>'
    +'<div style="flex:1;min-width:70px;background:#070718;border-radius:10px;padding:10px;text-align:center;">'
    +'<div style="font-size:9px;color:#555;letter-spacing:1px;">€/L MEDIO</div><div style="font-size:18px;font-weight:bold;color:var(--text);">'+avgPrice.toFixed(2)+'</div></div>'

    +(gas.length===0?'<div class="empty">Sin repostajes aún</div>':"")

    +'<div class="arow" style="flex-direction:column;gap:8px;">'
    +'<div style="font-size:10px;color:#555;letter-spacing:2px;font-family:monospace;">AÑADIR REPOSTAJE</div>'

    +'<input id="ng-litros" class="ai n" placeholder="Litros">'
    +'<input id="ng-kms" class="ai n" placeholder="Km viaje">'
    +'<input id="ng-kmtotal" class="ai n" placeholder="Km total">'
    +'<button style="background:#C17D3C;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:18px;font-weight:bold;" onclick="addGas()">+</button>'
    +'</div></div></div>';

function saveGasEdit(id){
  var d=cur();
  d.gasolina=d.gasolina.map(function(g){
    if(g.id!==id)return g;
    return {id:g.id,fecha:S.editRow.fecha||g.fecha,precio:parseFloat(S.editRow.precio)||g.precio,
      euros:parseFloat(S.editRow.euros)||g.euros,litros:parseFloat(S.editRow.litros)||g.litros,
      kms:parseFloat(S.editRow.kms)||g.kms,km_total:parseFloat(S.editRow.km_total)||g.km_total};
  });
  S.editId=null;saveData(d);
}
function delGas(id){var d=cur();var del=d.gasolina.find(function(g){return g.id===id;});pushUndo(d,"Repostaje borrado: "+(del?del.fecha:""));d.gasolina=d.gasolina.filter(function(g){return g.id!==id;});saveData(d);}
function addGas(){
  var fecha=document.getElementById("ng-fecha").value;
  var euros=parseFloat(document.getElementById("ng-euros").value);
  if(!fecha||isNaN(euros))return;
  var d=cur();if(!d.gasolina)d.gasolina=[];
  d.gasolina.push({id:uid(),fecha:fecha,
    precio:parseFloat(document.getElementById("ng-precio").value)||0,euros:euros,
    litros:parseFloat(document.getElementById("ng-litros").value)||0,
    kms:parseFloat(document.getElementById("ng-kms").value)||0,
    km_total:parseFloat(document.getElementById("ng-kmtotal").value)||0});
  saveData(d);
}

function addBet(){

function renderBancos(){
  var bk=cur().bankinter||[];var sb=cur().sabadell||[];
  function bankSection(title,color,items,which){
    var tot=items.reduce(function(s,x){return s+x.importe;},0);
    var paid=items.filter(function(x){return x.pagado;}).reduce(function(s,x){return s+x.importe;},0);
    var rows=items.map(function(item){
      return '<div class="card" style="margin-bottom:12px;">'+'<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1);">'+catIcon('bancos','#60A5FA',20)+'<span style="font-size:14px;font-weight:700;color:var(--t1);margin-left:10px;flex:1;">Bancos</span>'+'<button onclick="goBack()" style="display:flex;align-items:center;gap:6px;color:var(--t2);font-size:12px;padding:7px 12px;border-radius:10px;background:var(--s3);border:1px solid var(--b1);cursor:pointer;font-family:var(--f);">'+'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>Atrás</button>'+'</div></div>'+
  '<div class="chk-row" onclick="toggleChk(\''+which+'\',\''+item.id+'\')" style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #141428;cursor:pointer;">'
        +'<div style="display:flex;align-items:center;gap:10px;">'
        +'<div style="width:22px;height:22px;border-radius:6px;border:2px solid #2A2A40;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;'+(item.pagado?"background:#1A3A1A;border-color:#3A6A3A;":"")+'">'+(item.pagado?"✓":"")+'</div>'
        +'<span style="font-size:13px;color:'+(item.pagado?"#555":"#C0B8A8")+';'+(item.pagado?"text-decoration:line-through;":"")+'">'+esc(item.label)+'</span>'
        +'</div>'
        +'<span style="font-size:13px;font-weight:bold;color:'+(item.pagado?"#555":color)+'">'+fmt(item.importe)+'</span>'
        +'</div>';
    }).join("");
    var pct=tot>0?Math.round((paid/tot)*100):0;
    return '<div class="card" style="margin-bottom:10px;">'
      +'<div class="card-hdr" style="background:'+color+'18;">'
      +'<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">🏦</span>'
      +'<span style="font-size:14px;font-weight:bold;color:var(--text);">'+title+'</span></div>'
      +'<div style="text-align:right;">'
      +'<div style="font-size:13px;font-weight:bold;color:'+color+'">'+fmt(paid)+' / '+fmt(tot)+'</div>'
      +'<div style="font-size:10px;color:#444;">'+pct+'% cobrado</div>'
      +'</div></div>'
      +'<div style="height:3px;background:#070718;"><div style="height:3px;background:'+color+';width:'+pct+'%;transition:width .3s;"></div></div>'
      +rows
      +'<div style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #141428;">'
      +'<span style="font-size:12px;color:#555;">Pendiente</span>'
      +'<span style="font-size:14px;font-weight:bold;color:'+(paid<tot?"#F0A0A0":"#5AC45A")+'">'+fmt(tot-paid)+'</span>'
      +'</div></div>';
  }
  return bankSection("Bankinter","#1A7ABF",bk,"bankinter")
       + bankSection("Sabadell","#E8505B",sb,"sabadell");
}
function toggleChk(which,id){
  var d=cur();
  d[which]=d[which].map(function(x){return x.id===id?Object.assign({},x,{pagado:!x.pagado}):x;});
  saveData(d);
}
