// ─── VOICE INPUT ─────────────────────────────────────────────────────────────
var voiceParsed = null;
var voiceTimer = null;

var CATS_VOICE = [
  {id:"ocio",      labels:["ocio","cerveza","cervezas","bar","restaurante","cena","taxi","copa","copas","cafe","café","vino","vermut","tapas","discoteca","concierto","cine","theater","teatro","futbol","entrada"]},
  {id:"coche",     labels:["coche","gasolina","gasofa","parking","aparcamiento","taller","aceite","ruedas","itv","multa","seguro coche","carburante"]},
  {id:"inversion", labels:["inversión","inversion","btc","bitcoin","bolsa","acción","accion","crypto","fondo","myinvestor","river","kronos","cartera"]},
  {id:"regalos",   labels:["regalo","regalos","cumpleaños","cumpleanos","presente","detalle"]},
  {id:"pelo",      labels:["pelo","peluquería","peluqueria","corte","barbería","barberia","laser","láser","depilación","depilacion"]},
  {id:"salud",     labels:["fisio","fisioterapia","médico","medico","salud","bici","bicicleta","estática","estatica","gym","gimnasio","deporte","pesas","mancuernas","entrenamiento","nutricionista","psicólogo","psicologo"]},
  {id:"compras",   labels:["tablet","móvil","movil","ordenador","ordenador","ropa","zapatillas","electrónica","electronica","amazon","soporte","funda","carcasa","gadget","tecnología","tecnologia","auriculares","reloj","camara"]},
  {id:"otros",     labels:["otros","otro","libros","formación","formacion","suscripcion","suscripción","netflix","spotify","seguro"]}
];

function detectCat(text){
  var t = text.toLowerCase();
  var custom = S.customCats||[];
  for(var k=0;k<custom.length;k++){
    if(t.indexOf(custom[k].label.toLowerCase())>=0) return custom[k].id;
  }
  for(var i=0;i<CATS_VOICE.length;i++){
    for(var j=0;j<CATS_VOICE[i].labels.length;j++){
      if(t.indexOf(CATS_VOICE[i].labels[j])>=0) return CATS_VOICE[i].id;
    }
  }
  return "otros";
}

function parseVoiceLocal(text){
  // Look for number followed by euro indicator, or standalone number at end
  var amtMatch = text.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euros?|€|eur|e\b)/i)
    || text.match(/(?:^|\s)(\d+(?:[.,]\d{1,2})?)(?:\s|$)/);
  var amount = amtMatch ? parseFloat((amtMatch[1]||amtMatch[0]).replace(',','.')) : 0;
  var concept = text
    .replace(/\d+(?:[.,]\d{1,2})?\s*(?:euros?|€)?/gi,'')
    .replace(/(añadir|gasto|en|de|por|el|la|los|las|un|una|euros?)/gi,'')
    .trim().replace(/\s+/g,' ').trim();
  if(concept) concept = concept.charAt(0).toUpperCase() + concept.slice(1).toLowerCase();
  var catId = detectCat(text);
  var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===catId;});
  return {catId:catId, catLabel:catObj?catObj.label:catId, concept:concept||text, amount:amount};
}

function startVoice(){
  voiceParsed = null;
  document.getElementById("voice-modal").classList.add("show");
  document.getElementById("voice-result").classList.remove("show");
  document.getElementById("va-save").style.display = "none";
  document.getElementById("va-process").style.display = "inline-block";
  var inp = document.getElementById("voice-input");
  inp.value = "";
  setTimeout(function(){ inp.focus(); }, 300);
}

function closeVoice(){
  document.getElementById("voice-modal").classList.remove("show");
  voiceParsed = null;
}

function onVoiceInput(val){
  if(voiceTimer) clearTimeout(voiceTimer);
  if(val.trim().length > 3){
    voiceTimer = setTimeout(function(){ processVoiceText(val); }, 1200);
  }
}

function processVoiceText(text){
  if(!text || !text.trim()) return;
  if(voiceTimer) clearTimeout(voiceTimer);

  // Try Claude API first
  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 150,
      system: "Extrae gastos. Responde SOLO JSON sin texto extra: {catId,concept,amount}. Categorias: ocio,coche,inversion,regalos,pelo,otros",
      messages: [{role:"user", content: "Gasto: " + text}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    try{
      var txt = data.content && data.content[0] && data.content[0].text || "";
      var clean = txt.replace(/```[a-z]*|```/g,"").trim();
      var parsed = JSON.parse(clean);
      if(parsed.catId && parsed.amount > 0){
        var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===parsed.catId;});
        voiceParsed = {catId:parsed.catId, catLabel:catObj?catObj.label:parsed.catId, concept:parsed.concept||text, amount:parsed.amount};
        showVoiceResult(voiceParsed);
        return;
      }
    }catch(e){}
    voiceParsed = parseVoiceLocal(text);
    showVoiceResult(voiceParsed);
  })
  .catch(function(){
    voiceParsed = parseVoiceLocal(text);
    showVoiceResult(voiceParsed);
  });
}

function showVoiceResult(p){
  var catObj = CATS_BASE.concat(S.customCats||[]).find(function(c){return c.id===p.catId;});
  document.getElementById("vr-cat").textContent = (catObj?catObj.emoji+" ":"")+p.catLabel.toUpperCase();
  document.getElementById("vr-concepto").textContent = p.concept;
  document.getElementById("vr-importe").textContent = fmt(p.amount);
  document.getElementById("voice-result").classList.add("show");
  document.getElementById("va-save").style.display = "inline-block";
  document.getElementById("va-process").style.display = "none";
}

function saveVoiceGasto(){
  if(!voiceParsed || !voiceParsed.amount) return;
  // Save refs BEFORE closeVoice nulls voiceParsed
  var catId = voiceParsed.catId;
  var concept = voiceParsed.concept;
  var amount = voiceParsed.amount;
  var d = cur();
  if(!d.gastos[catId]) d.gastos[catId] = [];
  d.gastos[catId].push({id:uid(), concepto:concept, importe:amount, nota:""});
  saveData(d);
  closeVoice();
  // Redirect to the saved category
  setTab(catId);
  // Toast confirmation
  var toast = document.createElement("div");
  toast.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--green);border-radius:14px;padding:12px 22px;color:var(--green);font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5);font-weight:600;letter-spacing:.3px;";
  toast.textContent = "✓ "+concept+" — "+fmt(amount)+" guardado";
  document.body.appendChild(toast);
  setTimeout(function(){
    toast.style.opacity="0";toast.style.transition="opacity .3s";
    setTimeout(function(){toast.remove();},300);
  },2500);
}
